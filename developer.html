<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Developer Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <!-- Auth Screen -->
  <section id="authScreen" class="auth-page active">
    <div class="auth-container">
      <div class="lang-bar">
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIconAuth">&#9788;</span></button>
        <a href="index.html" class="nav-link" data-pt="nav_home"></a>
        <select id="portalLangSelect" onchange="switchPortalLang(this.value)">
          <option value="zh">中文</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
          <option value="es">Español</option>
        </select>
      </div>
      <h1 class="portal-title" data-pt="dev_title"></h1>
      <p class="portal-sub">DAO MESSAGE</p>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showAuthTab('register')" data-pt="tab_register"></button>
        <button class="auth-tab" onclick="showAuthTab('login')" data-pt="tab_login"></button>
      </div>

      <!-- Register -->
      <div id="registerPanel" class="auth-panel">
        <p class="auth-hint" data-pt="register_hint"></p>
        <div class="mnemonic-box" id="mnemonicBox"></div>
        <button class="btn-ghost" onclick="genNewMnemonic()" data-pt="gen_new"></button>
        <button class="btn-primary" onclick="doRegister()" data-pt="create_account"></button>
      </div>

      <!-- Login -->
      <div id="loginPanel" class="auth-panel" style="display:none;">
        <p class="auth-hint" data-pt="login_hint"></p>
        <textarea id="loginMnemonic" class="mnemonic-input" rows="3" data-pt-ph="login_placeholder"></textarea>
        <button class="btn-primary" onclick="doLogin()" data-pt="btn_login"></button>
        <p class="auth-error" id="loginError"></p>
      </div>
    </div>
  </section>

  <!-- Sidebar Layout -->
  <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div id="portalLayout" class="portal-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">DAO MESSAGE</div>
        <div class="sidebar-title" data-pt="dev_title"></div>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-item active" onclick="showPanel('dashboard')" data-panel="dashboard">
          <span class="sb-icon">&#9635;</span>
          <span data-pt="nav_dashboard">Dashboard</span>
        </button>
        <button class="sidebar-item" onclick="showPanel('submit')" data-panel="submit">
          <span class="sb-icon">&#10010;</span>
          <span data-pt="nav_submit">Submit Template</span>
        </button>
        <button class="sidebar-item" onclick="showPanel('templates')" data-panel="templates">
          <span class="sb-icon">&#9776;</span>
          <span data-pt="nav_my_tpl">My Templates</span>
        </button>
        <button class="sidebar-item" onclick="showPanel('usdt')" data-panel="usdt">
          <span class="sb-icon">&#36;</span>
          <span data-pt="nav_usdt">USDT Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-utils">
          <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIcon">&#9788;</span></button>
          <a href="index.html" class="nav-link" data-pt="nav_home"></a>
          <select id="portalLangSelectSidebar" onchange="switchPortalLang(this.value)">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
            <option value="ru">Русский</option>
            <option value="pt">Português</option>
            <option value="es">Español</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <div>
          <h2 class="topbar-title" data-pt="dash_title"></h2>
          <p class="topbar-sub" id="devIdDisplay"></p>
        </div>
        <button class="btn-ghost btn-sm" onclick="doLogout()" data-pt="btn_logout"></button>
      </div>

      <!-- Dashboard Panel -->
      <div id="panelDashboard" class="panel-view active">
        <div class="dash-summary" id="dashSummary"></div>
      </div>

      <!-- Submit Template Panel -->
      <div id="panelSubmit" class="panel-view">
        <div class="content-header">
          <h2 data-pt="submit_title"></h2>
        </div>
        <div class="card">
          <div class="form-group">
            <label data-pt="lbl_platform"></label>
            <div class="checkbox-row" id="platformChecks">
              <label><input type="radio" name="platform" value="Android"> Android</label>
              <label><input type="radio" name="platform" value="iOS"> iOS</label>
              <label><input type="radio" name="platform" value="PWA"> PWA</label>
              <label><input type="radio" name="platform" value="macOS"> macOS</label>
              <label><input type="radio" name="platform" value="Windows"> Windows</label>
              <label><input type="radio" name="platform" value="Linux"> Linux</label>
            </div>
          </div>
          <div class="form-group">
            <label data-pt="lbl_name"></label>
            <input type="text" id="tplName" class="input" data-pt-ph="ph_name">
          </div>
          <div class="form-group">
            <label data-pt="lbl_desc"></label>
            <textarea id="tplDesc" class="input" rows="3" data-pt-ph="ph_desc"></textarea>
          </div>
          <div class="form-group">
            <label data-pt="lbl_preview_img"></label>
            <div class="img-upload-area">
              <div class="img-grid" id="imgGrid"></div>
              <label class="img-add-btn" id="imgAddBtn">
                <input type="file" accept="image/*" multiple onchange="handleImgUpload(this)">
                <span>+</span>
              </label>
            </div>
            <p class="file-name" id="imgCount"></p>
          </div>
          <div class="form-group">
            <label data-pt="lbl_file"></label>
            <div class="file-upload" id="fileUploadArea">
              <input type="file" id="tplFile" accept=".txt" onchange="handleFileSelect(this)">
              <div class="file-upload-label" id="fileLabel" data-pt="ph_file"></div>
            </div>
            <p class="file-name" id="fileName"></p>
          </div>
          <div class="form-group">
            <label data-pt="lbl_price"></label>
            <input type="number" id="tplPrice" class="input" min="0" step="0.5" value="0">
          </div>
          <button class="btn-primary" onclick="submitTpl()" data-pt="btn_submit"></button>
          <p class="save-msg" id="tplMsg"></p>
        </div>
      </div>

      <!-- My Templates Panel -->
      <div id="panelTemplates" class="panel-view">
        <div class="content-header">
          <h2 data-pt="my_tpl_title"></h2>
        </div>
        <div id="myTemplatesList" class="template-review-list"></div>
      </div>

      <!-- USDT Settings Panel -->
      <div id="panelUsdt" class="panel-view">
        <div class="content-header">
          <h2 data-pt="settings_title"></h2>
        </div>
        <div class="card">
          <h3 class="card-title" data-pt="usdt_title"></h3>
          <div class="input-row">
            <input type="text" id="usdtAddrInput" class="input" data-pt-ph="usdt_placeholder">
          </div>
        </div>
        <div class="card">
          <h3 class="card-title" data-pt="contact_title"></h3>
          <div class="form-group">
            <label data-pt="lbl_website"></label>
            <input type="text" id="devWebsite" class="input" placeholder="https://...">
          </div>
          <div class="form-group">
            <label data-pt="lbl_contact"></label>
            <input type="text" id="devContact" class="input" data-pt-ph="ph_contact">
          </div>
          <div class="form-group">
            <label class="checkbox-row"><input type="checkbox" id="devShowContact"> <span data-pt="lbl_show_contact"></span></label>
          </div>
        </div>
        <button class="btn-primary" onclick="saveSettings()" data-pt="btn_save"></button>
        <p class="save-msg" id="settingsMsg"></p>
      </div>
    </main>
  </div>

  <!-- Update Modal -->
  <div id="updateModal" class="modal-overlay">
    <div class="modal" style="max-width:560px;max-height:90vh;overflow-y:auto;">
      <button class="modal-close" onclick="closeUpdateModal()">&times;</button>
      <h3 id="updateModalTitle" style="margin-bottom:16px;"></h3>
      <div class="form-group">
        <label data-pt="lbl_platform"></label>
        <div class="checkbox-row" id="updatePlatformChecks">
          <label><input type="radio" name="updatePlatform" value="Android"> Android</label>
          <label><input type="radio" name="updatePlatform" value="iOS"> iOS</label>
          <label><input type="radio" name="updatePlatform" value="PWA"> PWA</label>
          <label><input type="radio" name="updatePlatform" value="macOS"> macOS</label>
          <label><input type="radio" name="updatePlatform" value="Windows"> Windows</label>
          <label><input type="radio" name="updatePlatform" value="Linux"> Linux</label>
        </div>
      </div>
      <div class="form-group">
        <label data-pt="lbl_name"></label>
        <input type="text" id="updateName" class="input" data-pt-ph="ph_name">
      </div>
      <div class="form-group">
        <label data-pt="lbl_desc"></label>
        <textarea id="updateDesc" class="input" rows="3" data-pt-ph="ph_desc"></textarea>
      </div>
      <div class="form-group">
        <label data-pt="lbl_preview_img"></label>
        <div class="img-upload-area">
          <div class="img-grid" id="updateImgGrid"></div>
          <label class="img-add-btn" id="updateImgAddBtn">
            <input type="file" accept="image/*" multiple onchange="handleUpdateImgUpload(this)">
            <span>+</span>
          </label>
        </div>
        <p class="file-name" id="updateImgCount"></p>
      </div>
      <div class="form-group">
        <label data-pt="lbl_file"></label>
        <div class="file-upload">
          <input type="file" id="updateFile" accept=".txt" onchange="handleUpdateFile(this)">
          <div class="file-upload-label" data-pt="ph_file"></div>
        </div>
        <p class="file-name" id="updateFileName"></p>
      </div>
      <div class="form-group">
        <label data-pt="lbl_price"></label>
        <input type="number" id="updatePrice" class="input" min="0" step="0.5" value="0">
      </div>
      <div class="form-group">
        <label id="updateNoteLabel"></label>
        <textarea id="updateNoteInput" class="input" rows="3"></textarea>
      </div>
      <button class="btn-primary" onclick="submitUpdate()" id="updateSubmitBtn"></button>
      <p class="save-msg" id="updateMsg"></p>
    </div>
  </div>

  <!-- History Modal -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal" style="max-width:500px;">
      <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
      <h3 id="historyModalTitle" style="margin-bottom:16px;"></h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script src="store.js?v=9"></script>
  <script src="portal-i18n.js?v=9"></script>
  <script>
    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("dao_theme", next);
      const icon = next === "dark" ? "&#9788;" : "&#9790;";
      document.getElementById("themeIcon").innerHTML = icon;
      document.getElementById("themeIconAuth").innerHTML = icon;
    }
    (function initTheme() {
      const t = localStorage.getItem("dao_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      const icon = t === "dark" ? "&#9788;" : "&#9790;";
      document.getElementById("themeIcon").innerHTML = icon;
      document.getElementById("themeIconAuth").innerHTML = icon;
    })();

    // Sidebar navigation
    function showPanel(name) {
      document.querySelectorAll(".panel-view").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".sidebar-item[data-panel]").forEach(b => b.classList.remove("active"));
      const panelId = "panel" + name.charAt(0).toUpperCase() + name.slice(1);
      const panel = document.getElementById(panelId);
      if (panel) panel.classList.add("active");
      const btn = document.querySelector(`.sidebar-item[data-panel="${name}"]`);
      if (btn) btn.classList.add("active");
      // Close mobile sidebar
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("active");
      // Refresh data for panels
      if (name === "dashboard") refreshDashboard();
      if (name === "templates") renderMyTemplates();
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarOverlay").classList.toggle("active");
    }

    // Image upload (max 9)
    let uploadedImages = [];
    const MAX_IMAGES = 9;

    function handleImgUpload(input) {
      const files = Array.from(input.files);
      const remaining = MAX_IMAGES - uploadedImages.length;
      const toProcess = files.slice(0, remaining);

      toProcess.forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = function(e) {
          if (uploadedImages.length >= MAX_IMAGES) return;
          uploadedImages.push(e.target.result);
          renderImgGrid();
        };
        reader.readAsDataURL(file);
      });
      input.value = "";
    }

    function removeImg(idx) {
      uploadedImages.splice(idx, 1);
      renderImgGrid();
    }

    function renderImgGrid() {
      const grid = document.getElementById("imgGrid");
      const addBtn = document.getElementById("imgAddBtn");
      const count = document.getElementById("imgCount");

      grid.innerHTML = uploadedImages.map((src, i) =>
        `<div class="img-thumb"><img src="${src}"><button class="img-remove" onclick="removeImg(${i})">&times;</button></div>`
      ).join("");

      addBtn.style.display = uploadedImages.length >= MAX_IMAGES ? "none" : "flex";
      count.textContent = uploadedImages.length + " / " + MAX_IMAGES;
      count.style.color = "var(--text-muted)";
    }

    // File upload
    let uploadedFileContent = "";

    function handleFileSelect(input) {
      const file = input.files[0];
      if (!file) return;
      if (!file.name.endsWith(".txt")) {
        document.getElementById("fileName").textContent = pt("err_file_type");
        document.getElementById("fileName").style.color = "#ef4444";
        uploadedFileContent = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        uploadedFileContent = e.target.result;
        document.getElementById("fileName").textContent = file.name + " (" + (file.size / 1024).toFixed(1) + " KB)";
        document.getElementById("fileName").style.color = "var(--green)";
      };
      reader.readAsText(file);
    }

    // Auth
    let currentMnemonic = "";

    function showAuthTab(tab) {
      document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
      document.getElementById("registerPanel").style.display = tab === "register" ? "block" : "none";
      document.getElementById("loginPanel").style.display = tab === "login" ? "block" : "none";
      event.target.classList.add("active");
    }

    function genNewMnemonic() {
      currentMnemonic = generateMnemonic();
      document.getElementById("mnemonicBox").textContent = currentMnemonic;
    }

    async function doRegister() {
      if (!currentMnemonic) { genNewMnemonic(); return; }
      try {
        await registerDeveloper(currentMnemonic);
        await showDashboard();
      } catch(e) { alert(e.message); }
    }

    async function doLogin() {
      const m = document.getElementById("loginMnemonic").value.trim().toLowerCase();
      if (!m) return;
      try {
        await loginDeveloper(m);
        await showDashboard();
      } catch(e) {
        document.getElementById("loginError").textContent = pt("invalid_mnemonic");
      }
    }

    function doLogout() { logoutDev(); showAuth(); }

    function showAuth() {
      document.getElementById("authScreen").classList.add("active");
      document.getElementById("portalLayout").classList.remove("active");
    }

    async function showDashboard() {
      const devId = getCurrentDevId();
      if (!devId) { showAuth(); return; }
      document.getElementById("authScreen").classList.remove("active");
      document.getElementById("portalLayout").classList.add("active");
      try {
        const dev = await getDevProfile();
        document.getElementById("devIdDisplay").textContent = "ID: " + dev.id;
        document.getElementById("usdtAddrInput").value = dev.usdtAddress || "";
        document.getElementById("devWebsite").value = dev.website || "";
        document.getElementById("devContact").value = dev.contact || "";
        document.getElementById("devShowContact").checked = !!dev.showContact;
      } catch(e) { logoutDev(); showAuth(); return; }
      await refreshDashboard();
    }

    async function refreshDashboard() {
      const summary = document.getElementById("dashSummary");
      try {
        const dev = await getDevProfile();
        const tpls = await getMyTemplates();
        const pending = tpls.filter(t => t.status === "pending").length;
        const approved = tpls.filter(t => t.status === "approved").length;
        const rejected = tpls.filter(t => t.status === "rejected").length;
        summary.innerHTML = `
          <div class="dash-summary-card">
            <div class="summary-label">DEV ID</div>
            <div class="summary-value mono">${esc(dev.id)}</div>
          </div>
          <div class="dash-summary-card">
            <div class="summary-label">${pt("stat_total_tpl") || "TOTAL"}</div>
            <div class="summary-value">${tpls.length}</div>
          </div>
          <div class="dash-summary-card">
            <div class="summary-label">${pt("stat_approved") || "APPROVED"}</div>
            <div class="summary-value" style="color:var(--green)">${approved}</div>
          </div>
          <div class="dash-summary-card">
            <div class="summary-label">${pt("stat_pending") || "PENDING"}</div>
            <div class="summary-value" style="color:#facc15">${pending}</div>
          </div>
          <div class="dash-summary-card">
            <div class="summary-label">${pt("stat_rejected") || "REJECTED"}</div>
            <div class="summary-value" style="color:#ef4444">${rejected}</div>
          </div>
        `;
      } catch(e) {
        summary.innerHTML = `<p class="empty-msg">${e.message}</p>`;
      }
    }

    async function saveSettings() {
      try {
        await updateDevSettings({
          address: document.getElementById("usdtAddrInput").value.trim(),
          website: document.getElementById("devWebsite").value.trim(),
          contact: document.getElementById("devContact").value.trim(),
          showContact: document.getElementById("devShowContact").checked
        });
        const msg = document.getElementById("settingsMsg");
        msg.textContent = pt("saved"); msg.style.color = "var(--green)";
        setTimeout(() => msg.textContent = "", 2000);
      } catch(e) { alert(e.message); }
    }

    async function submitTpl() {
      const name = document.getElementById("tplName").value.trim();
      const desc = document.getElementById("tplDesc").value.trim();
      const price = document.getElementById("tplPrice").value;
      const selected = document.querySelector('#platformChecks input[name="platform"]:checked');
      const platform = selected ? selected.value : "";
      const msg = document.getElementById("tplMsg");

      if (!platform) { msg.textContent = pt("err_platform"); msg.style.color = "#ef4444"; return; }
      if (!name) { msg.textContent = pt("err_name"); msg.style.color = "#ef4444"; return; }
      if (!desc) { msg.textContent = pt("err_desc"); msg.style.color = "#ef4444"; return; }
      if (!uploadedFileContent) { msg.textContent = pt("err_file"); msg.style.color = "#ef4444"; return; }

      try {
        await submitTemplate({ name, description: desc, images: [...uploadedImages], price, platforms: [platform], fileContent: uploadedFileContent });
        document.getElementById("tplName").value = "";
        document.getElementById("tplDesc").value = "";
        document.getElementById("tplPrice").value = "0";
        document.getElementById("tplFile").value = "";
        document.getElementById("fileName").textContent = "";
        uploadedFileContent = "";
        uploadedImages = [];
        renderImgGrid();
        if (selected) selected.checked = false;
        msg.textContent = pt("submit_ok"); msg.style.color = "var(--green)";
        setTimeout(() => msg.textContent = "", 3000);
      } catch(e) { msg.textContent = e.message; msg.style.color = "#ef4444"; }
    }

    async function renderMyTemplates() {
      const list = document.getElementById("myTemplatesList");
      try {
        const tpls = await getMyTemplates();
        if (tpls.length === 0) { list.innerHTML = `<p class="empty-msg">${pt("no_tpl")}</p>`; return; }
        list.innerHTML = tpls.map(t => {
          const sc = t.status === "published" ? "status-published" : t.status === "approved" ? "status-approved" : t.status === "rejected" ? "status-rejected" : "status-pending";
          const sl = pt("status_" + t.status);
          const ver = `v${t.version || 1}`;
          let actions = "";
          if (t.status === "approved") actions += `<button class="btn-primary btn-sm" onclick="doPublish('${t.id}', true)">${pt("btn_publish")}</button>`;
          if (t.status === "published") actions += `<button class="btn-ghost btn-sm" onclick="doPublish('${t.id}', false)">${pt("btn_unpublish")}</button>`;
          actions += `<button class="btn-ghost btn-sm" onclick="openUpdateModal('${t.id}', '${esc(t.name)}')">${pt("btn_update")}</button>`;
          actions += `<button class="btn-ghost btn-sm" onclick="openHistoryModal('${t.id}', '${esc(t.name)}')">${pt("btn_history")}</button>`;
          actions += `<button class="btn-ghost btn-sm btn-danger" onclick="doDeleteTpl('${t.id}')">${pt("btn_delete")}</button>`;
          return `<div class="review-card review-card-vertical"><div class="review-info"><h4>${esc(t.name)} <span class="badge status-pending" style="font-size:10px;">${ver}</span></h4><p>${esc(t.description)}</p><div class="review-meta"><span class="badge ${sc}">${sl}</span><span>${t.platforms.join(", ")}</span><span>${t.price > 0 ? "$" + t.price : pt("free")}</span></div></div><div class="review-actions-row">${actions}</div></div>`;
        }).join("");
      } catch(e) { list.innerHTML = `<p class="empty-msg">${e.message}</p>`; }
    }

    async function doDeleteTpl(id) { await deleteTemplate(id); await renderMyTemplates(); }
    async function doPublish(id, pub) { try { await publishTemplate(id, pub); await renderMyTemplates(); } catch(e) { alert(e.message); } }

    // Update modal
    let updateTplId = "";
    let updateFileContent = "";
    let updateImages = [];

    async function openUpdateModal(id, name) {
      updateTplId = id;
      updateFileContent = "";
      updateImages = [];
      document.getElementById("updateModalTitle").textContent = pt("update_title") + " - " + name;
      document.getElementById("updateNoteLabel").textContent = pt("update_note_label");
      document.getElementById("updateNoteInput").placeholder = pt("update_note_ph");
      document.getElementById("updateNoteInput").value = "";
      document.getElementById("updateSubmitBtn").textContent = pt("btn_submit_update");
      document.getElementById("updateFile").value = "";
      document.getElementById("updateFileName").textContent = "";
      document.getElementById("updateMsg").textContent = "";
      // Load current template data
      try {
        const tpl = await getTemplateById(id);
        document.getElementById("updateName").value = tpl.name || "";
        document.getElementById("updateDesc").value = tpl.description || "";
        document.getElementById("updatePrice").value = tpl.price || 0;
        // Set platform radio
        document.querySelectorAll('#updatePlatformChecks input[name="updatePlatform"]').forEach(r => {
          r.checked = tpl.platforms && tpl.platforms.includes(r.value);
        });
        // Load existing images
        updateImages = tpl.images ? [...tpl.images] : [];
        renderUpdateImgGrid();
      } catch(e) { console.error(e); }
      document.getElementById("updateModal").classList.add("show");
      switchPortalLang(portalLang);
    }
    function closeUpdateModal() { document.getElementById("updateModal").classList.remove("show"); }

    function handleUpdateImgUpload(input) {
      const files = Array.from(input.files);
      const remaining = MAX_IMAGES - updateImages.length;
      files.slice(0, remaining).forEach(file => {
        if (!file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = e => {
          if (updateImages.length >= MAX_IMAGES) return;
          updateImages.push(e.target.result);
          renderUpdateImgGrid();
        };
        reader.readAsDataURL(file);
      });
      input.value = "";
    }

    function removeUpdateImg(idx) {
      updateImages.splice(idx, 1);
      renderUpdateImgGrid();
    }

    function renderUpdateImgGrid() {
      const grid = document.getElementById("updateImgGrid");
      const addBtn = document.getElementById("updateImgAddBtn");
      const count = document.getElementById("updateImgCount");
      grid.innerHTML = updateImages.map((src, i) =>
        `<div class="img-thumb"><img src="${src}"><button class="img-remove" onclick="removeUpdateImg(${i})">&times;</button></div>`
      ).join("");
      addBtn.style.display = updateImages.length >= MAX_IMAGES ? "none" : "flex";
      count.textContent = updateImages.length + " / " + MAX_IMAGES;
      count.style.color = "var(--text-muted)";
    }

    function handleUpdateFile(input) {
      const file = input.files[0];
      if (!file || !file.name.endsWith(".txt")) { updateFileContent = ""; return; }
      const reader = new FileReader();
      reader.onload = e => {
        updateFileContent = e.target.result;
        document.getElementById("updateFileName").textContent = file.name;
        document.getElementById("updateFileName").style.color = "var(--green)";
      };
      reader.readAsText(file);
    }

    async function submitUpdate() {
      const note = document.getElementById("updateNoteInput").value.trim();
      const msg = document.getElementById("updateMsg");
      if (!note) { msg.textContent = pt("update_note_ph"); msg.style.color = "#ef4444"; return; }
      const name = document.getElementById("updateName").value.trim();
      const desc = document.getElementById("updateDesc").value.trim();
      const price = document.getElementById("updatePrice").value;
      const selPlat = document.querySelector('#updatePlatformChecks input[name="updatePlatform"]:checked');
      if (!name) { msg.textContent = pt("err_name"); msg.style.color = "#ef4444"; return; }
      if (!desc) { msg.textContent = pt("err_desc"); msg.style.color = "#ef4444"; return; }
      try {
        const body = {
          updateNote: note,
          name,
          description: desc,
          price,
          images: [...updateImages]
        };
        if (selPlat) body.platforms = [selPlat.value];
        if (updateFileContent) body.fileContent = updateFileContent;
        await updateTemplate(updateTplId, body);
        msg.textContent = pt("update_ok"); msg.style.color = "var(--green)";
        setTimeout(() => { closeUpdateModal(); renderMyTemplates(); }, 1000);
      } catch(e) { msg.textContent = e.message; msg.style.color = "#ef4444"; }
    }

    // History modal
    async function openHistoryModal(id, name) {
      document.getElementById("historyModalTitle").textContent = pt("history_title") + " - " + name;
      document.getElementById("historyList").innerHTML = "Loading...";
      document.getElementById("historyModal").classList.add("show");
      try {
        const tpl = await getTemplateById(id);
        const history = tpl.updateHistory || [];
        if (history.length === 0) {
          document.getElementById("historyList").innerHTML = `<p class="empty-msg">${pt("no_history")}</p>`;
          return;
        }
        document.getElementById("historyList").innerHTML = history.slice().reverse().map(h =>
          `<div class="history-item"><div class="history-ver">${pt("version_label")} ${h.version || "?"}</div><div class="history-note">${esc(h.note)}</div><div class="history-time">${new Date(h.timestamp).toLocaleString()}</div></div>`
        ).join("");
      } catch(e) { document.getElementById("historyList").innerHTML = e.message; }
    }
    function closeHistoryModal() { document.getElementById("historyModal").classList.remove("show"); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // Sync lang selects
    function syncLangSelects() {
      const val = document.getElementById("portalLangSelect").value;
      const sidebar = document.getElementById("portalLangSelectSidebar");
      if (sidebar) sidebar.value = val;
    }

    // Override switchPortalLang to sync both selects
    const _origSwitchLang = typeof switchPortalLang === "function" ? switchPortalLang : null;
    // We'll handle sync after initPortalLang

    // Init
    genNewMnemonic();
    initPortalLang();
    syncLangSelects();
    if (getCurrentDevId()) showDashboard();
  </script>
</body>
</html>
