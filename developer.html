<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Developer Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="lang-bar">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIcon">&#9788;</span></button>
    <a href="/" class="nav-link" data-pt="nav_home"></a>
    <select id="portalLangSelect" onchange="switchPortalLang(this.value)">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="pt">Português</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- Auth Screen -->
  <section id="authScreen" class="page active">
    <div class="page-inner auth-container">
      <h1 class="portal-title" data-pt="dev_title"></h1>
      <p class="portal-sub">DAO MESSAGE</p>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="showAuthTab('register')" data-pt="tab_register"></button>
        <button class="auth-tab" onclick="showAuthTab('login')" data-pt="tab_login"></button>
      </div>

      <!-- Register -->
      <div id="registerPanel" class="auth-panel">
        <p class="auth-hint" data-pt="register_hint"></p>
        <div class="mnemonic-box" id="mnemonicBox"></div>
        <button class="btn-ghost" onclick="genNewMnemonic()" data-pt="gen_new"></button>
        <button class="btn-primary" onclick="doRegister()" data-pt="create_account"></button>
      </div>

      <!-- Login -->
      <div id="loginPanel" class="auth-panel" style="display:none;">
        <p class="auth-hint" data-pt="login_hint"></p>
        <textarea id="loginMnemonic" class="mnemonic-input" rows="3" data-pt-ph="login_placeholder"></textarea>
        <button class="btn-primary" onclick="doLogin()" data-pt="btn_login"></button>
        <p class="auth-error" id="loginError"></p>
      </div>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="dashScreen" class="page">
    <div class="page-inner">
      <div class="dash-header">
        <div>
          <h2 class="portal-title-sm" data-pt="dash_title"></h2>
          <p class="dev-id" id="devIdDisplay"></p>
        </div>
        <button class="btn-ghost btn-sm" onclick="doLogout()" data-pt="btn_logout"></button>
      </div>

      <div class="card">
        <h3 class="card-title" data-pt="usdt_title"></h3>
        <div class="input-row">
          <input type="text" id="usdtAddrInput" class="input" data-pt-ph="usdt_placeholder">
          <button class="btn-primary btn-sm" onclick="saveUsdtAddr()" data-pt="btn_save"></button>
        </div>
        <p class="save-msg" id="usdtMsg"></p>
      </div>

      <div class="card">
        <h3 class="card-title" data-pt="submit_title"></h3>
        <div class="form-group">
          <label data-pt="lbl_name"></label>
          <input type="text" id="tplName" class="input" data-pt-ph="ph_name">
        </div>
        <div class="form-group">
          <label data-pt="lbl_desc"></label>
          <textarea id="tplDesc" class="input" rows="3" data-pt-ph="ph_desc"></textarea>
        </div>
        <div class="form-group">
          <label data-pt="lbl_preview"></label>
          <input type="text" id="tplPreview" class="input" data-pt-ph="ph_preview">
        </div>
        <div class="form-group">
          <label data-pt="lbl_price"></label>
          <input type="number" id="tplPrice" class="input" min="0" step="0.5" value="0">
        </div>
        <div class="form-group">
          <label data-pt="lbl_platforms"></label>
          <div class="checkbox-row" id="platformChecks">
            <label><input type="checkbox" value="Android"> Android</label>
            <label><input type="checkbox" value="iOS"> iOS</label>
            <label><input type="checkbox" value="PWA"> PWA</label>
            <label><input type="checkbox" value="macOS"> macOS</label>
            <label><input type="checkbox" value="Windows"> Windows</label>
            <label><input type="checkbox" value="Linux"> Linux</label>
          </div>
        </div>
        <button class="btn-primary" onclick="submitTpl()" data-pt="btn_submit"></button>
        <p class="save-msg" id="tplMsg"></p>
      </div>

      <div class="card">
        <h3 class="card-title" data-pt="my_tpl_title"></h3>
        <div id="myTemplatesList" class="template-review-list"></div>
      </div>
    </div>
  </section>

  <script src="store.js"></script>
  <script src="portal-i18n.js"></script>
  <script>
    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("dao_theme", next);
      document.getElementById("themeIcon").innerHTML = next === "dark" ? "&#9788;" : "&#9790;";
    }
    (function initTheme() {
      const t = localStorage.getItem("dao_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeIcon").innerHTML = t === "dark" ? "&#9788;" : "&#9790;";
    })();

    // Auth
    let currentMnemonic = "";

    function showAuthTab(tab) {
      document.querySelectorAll(".auth-tab").forEach(t => t.classList.remove("active"));
      document.getElementById("registerPanel").style.display = tab === "register" ? "block" : "none";
      document.getElementById("loginPanel").style.display = tab === "login" ? "block" : "none";
      event.target.classList.add("active");
    }

    function genNewMnemonic() {
      currentMnemonic = generateMnemonic();
      document.getElementById("mnemonicBox").textContent = currentMnemonic;
    }

    function doRegister() {
      if (!currentMnemonic) { genNewMnemonic(); return; }
      registerDeveloper(currentMnemonic);
      loginDeveloper(currentMnemonic);
      showDashboard();
    }

    function doLogin() {
      const m = document.getElementById("loginMnemonic").value.trim().toLowerCase();
      if (!m) return;
      registerDeveloper(m);
      const dev = loginDeveloper(m);
      if (dev) {
        showDashboard();
      } else {
        document.getElementById("loginError").textContent = pt("invalid_mnemonic");
      }
    }

    function doLogout() { logoutDev(); showAuth(); }

    function showAuth() {
      document.getElementById("authScreen").classList.add("active");
      document.getElementById("dashScreen").classList.remove("active");
    }

    function showDashboard() {
      document.getElementById("authScreen").classList.remove("active");
      document.getElementById("dashScreen").classList.add("active");
      const dev = getCurrentDev();
      if (!dev) { showAuth(); return; }
      document.getElementById("devIdDisplay").textContent = "ID: " + dev.id;
      document.getElementById("usdtAddrInput").value = dev.usdtAddress || "";
      renderMyTemplates();
    }

    function saveUsdtAddr() {
      const dev = getCurrentDev();
      if (!dev) return;
      updateDevUsdtAddress(dev.id, document.getElementById("usdtAddrInput").value.trim());
      const msg = document.getElementById("usdtMsg");
      msg.textContent = pt("saved"); msg.style.color = "var(--green)";
      setTimeout(() => msg.textContent = "", 2000);
    }

    function submitTpl() {
      const dev = getCurrentDev();
      if (!dev) return;
      const name = document.getElementById("tplName").value.trim();
      const desc = document.getElementById("tplDesc").value.trim();
      const preview = document.getElementById("tplPreview").value.trim();
      const price = document.getElementById("tplPrice").value;
      const checks = document.querySelectorAll("#platformChecks input:checked");
      const platforms = Array.from(checks).map(c => c.value);
      const msg = document.getElementById("tplMsg");

      if (!name) { msg.textContent = pt("err_name"); msg.style.color = "#ef4444"; return; }
      if (!desc) { msg.textContent = pt("err_desc"); msg.style.color = "#ef4444"; return; }
      if (platforms.length === 0) { msg.textContent = pt("err_platform"); msg.style.color = "#ef4444"; return; }

      submitTemplate({ devId: dev.id, name, description: desc, preview, price, platforms });
      document.getElementById("tplName").value = "";
      document.getElementById("tplDesc").value = "";
      document.getElementById("tplPreview").value = "";
      document.getElementById("tplPrice").value = "0";
      checks.forEach(c => c.checked = false);
      msg.textContent = pt("submit_ok"); msg.style.color = "var(--green)";
      setTimeout(() => msg.textContent = "", 3000);
      renderMyTemplates();
    }

    function renderMyTemplates() {
      const dev = getCurrentDev();
      if (!dev) return;
      const list = document.getElementById("myTemplatesList");
      const tpls = getDevTemplates(dev.id);
      if (tpls.length === 0) { list.innerHTML = `<p class="empty-msg">${pt("no_tpl")}</p>`; return; }
      list.innerHTML = tpls.map(t => {
        const sc = t.status === "approved" ? "status-approved" : t.status === "rejected" ? "status-rejected" : "status-pending";
        const sl = pt("status_" + (t.status === "approved" ? "approved" : t.status === "rejected" ? "rejected" : "pending"));
        return `<div class="review-card"><div class="review-info"><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p><div class="review-meta"><span class="badge ${sc}">${sl}</span><span>${t.platforms.join(", ")}</span><span>${t.price > 0 ? "$" + t.price : pt("free")}</span></div></div><button class="btn-ghost btn-sm btn-danger" onclick="deleteTpl('${t.id}')">${pt("btn_delete")}</button></div>`;
      }).join("");
    }

    function deleteTpl(id) { deleteTemplate(id); renderMyTemplates(); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    // Init
    genNewMnemonic();
    initPortalLang();
    const dev = getCurrentDev();
    if (dev) showDashboard();
  </script>
</body>
</html>
