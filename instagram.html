<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>세제로 (@iamsezero) • Instagram photos and videos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3CradialGradient id='g' r='150%25' cx='30%25' cy='107%25'%3E%3Cstop offset='0' stop-color='%23fdf497'/%3E%3Cstop offset='.05' stop-color='%23fdf497'/%3E%3Cstop offset='.45' stop-color='%23fd5949'/%3E%3Cstop offset='.6' stop-color='%23d6249f'/%3E%3Cstop offset='.9' stop-color='%23285AEB'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='4.5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Ccircle cx='17' cy='7' r='1.2' fill='%23fff'/%3E%3Crect x='4.5' y='4.5' width='15' height='15' rx='4.5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
  <style>
    :root {
      --ig-bg: #ffffff;
      --ig-text: #000000;
      --ig-secondary: #737373;
      --ig-border: #dbdbdb;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --ig-grey-btn: #efefef;
      --ig-grey-btn-hover: #dbdbdb;
      --ig-red: #ed4956;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ig-bg: #000000;
        --ig-text: #ffffff;
        --ig-secondary: #a8a8a8;
        --ig-border: #262626;
        --ig-grey-btn: #363636;
        --ig-grey-btn-hover: #262626;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--ig-bg);
      color: var(--ig-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 14px;
      line-height: 18px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 470px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      border-left: 1px solid var(--ig-border);
      border-right: 1px solid var(--ig-border);
      padding-bottom: 56px;
      background: var(--ig-bg);
    }

    svg { display: block; }

    /* ===== Top bar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 8px 0 16px;
      background: var(--ig-bg);
      border-bottom: 0.5px solid var(--ig-border);
    }
    .topbar .username {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 20px;
      font-weight: 700;
    }
    .topbar .username .lock { margin-right: 1px; }
    .topbar .username .verified { margin-left: 1px; }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ig-text);
      cursor: pointer;
      position: relative;
    }
    .icon-btn .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: var(--ig-red);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      border-radius: 9px;
      text-align: center;
    }

    /* ===== Profile header ===== */
    .profile-header {
      padding: 16px 16px 0;
    }
    .ph-top {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .avatar-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .avatar-ring .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--ig-bg);
      background: #efefef;
      display: block;
    }
    .note-bubble {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ig-grey-btn);
      color: var(--ig-text);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 14px;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .note-bubble::after,
    .note-bubble::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--ig-grey-btn);
    }
    .note-bubble::before { width: 8px; height: 8px; bottom: -8px; }
    .note-bubble::after { width: 4px; height: 4px; bottom: -14px; }

    .stats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat { cursor: pointer; }
    .stat .num {
      font-size: 17px;
      font-weight: 700;
      line-height: 20px;
    }
    .stat .label {
      font-size: 13px;
      color: var(--ig-text);
    }

    .ph-bio {
      padding-top: 12px;
      font-size: 14px;
      line-height: 19px;
    }
    .display-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .category { color: var(--ig-secondary); }
    .bio { white-space: pre-line; margin-top: 1px; }
    .bio .mention, .bio .tag { color: #00376b; }
    @media (prefers-color-scheme: dark) {
      .bio .mention, .bio .tag { color: #e0f1ff; }
    }
    .bio-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ig-text);
      font-weight: 600;
      text-decoration: none;
      margin-top: 1px;
    }
    .bio-link svg { transform: rotate(0deg); }
    .followed-by {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--ig-secondary);
      font-size: 12px;
    }
    .followed-by .faces {
      display: flex;
    }
    .followed-by .faces img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--ig-bg);
      object-fit: cover;
      margin-left: -6px;
    }
    .followed-by .faces img:first-child { margin-left: 0; }

    /* ===== Action buttons ===== */
    .actions {
      display: flex;
      gap: 6px;
      padding: 14px 16px 0;
    }
    .btn {
      height: 32px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ig-text);
      background: var(--ig-grey-btn);
    }
    .btn:active { opacity: .7; }
    .btn.flex { flex: 1; }
    .btn.follow {
      background: var(--ig-blue);
      color: #fff;
    }
    .btn.follow.following { background: var(--ig-grey-btn); color: var(--ig-text); }
    .btn.icon { width: 32px; flex: none; }

    /* ===== Highlights ===== */
    .highlights {
      display: flex;
      gap: 16px;
      padding: 18px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .highlights::-webkit-scrollbar { display: none; }
    .highlight {
      flex-shrink: 0;
      width: 64px;
      text-align: center;
      cursor: pointer;
    }
    .highlight .h-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--ig-border);
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .highlight .h-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .highlight.new .h-ring {
      font-size: 26px;
      color: var(--ig-text);
      font-weight: 300;
    }
    .highlight .h-label {
      font-size: 12px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Tabs ===== */
    .tabs {
      position: sticky;
      top: 44px;
      z-index: 10;
      display: flex;
      border-top: 0.5px solid var(--ig-border);
      background: var(--ig-bg);
      margin-top: 4px;
    }
    .tab {
      flex: 1;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ig-secondary);
      border-bottom: 1px solid transparent;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab.active {
      color: var(--ig-text);
      border-bottom: 1px solid var(--ig-text);
    }

    /* ===== Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #efefef;
    }
    @media (prefers-color-scheme: dark) { .cell { background: #1a1a1a; } }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cell .corner {
      position: absolute;
      top: 7px;
      right: 7px;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
    }
    .cell .views {
      position: absolute;
      bottom: 7px;
      left: 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }

    /* ===== Bottom nav ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 470px;
      height: 50px;
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--ig-bg);
      border-top: 0.5px solid var(--ig-border);
      z-index: 30;
    }
    .nav-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ig-text);
      cursor: pointer;
    }
    .nav-btn .nav-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--ig-text);
    }

    /* ===== Post detail modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--ig-bg);
      display: none;
      flex-direction: column;
      max-width: 470px;
      margin: 0 auto;
      animation: slideUp 0.22s ease;
    }
    .modal.open { display: flex; }
    @keyframes slideUp {
      from { transform: translateY(14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-bar {
      display: flex;
      align-items: center;
      height: 44px;
      flex-shrink: 0;
      padding: 0 8px;
      border-bottom: 0.5px solid var(--ig-border);
      gap: 6px;
    }
    .modal-bar .back {
      background: none;
      border: none;
      color: var(--ig-text);
      cursor: pointer;
      display: flex;
      padding: 6px;
    }
    .modal-bar .mb-title {
      font-size: 12px;
      color: var(--ig-secondary);
      font-weight: 600;
    }
    .modal-bar .mb-title b { color: var(--ig-text); font-size: 15px; display: block; }
    .modal-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }

    .post-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
    }
    .post-head .pa {
      width: 32px; height: 32px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      padding: 1.5px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888);
    }
    .post-head .pa-inner {
      width: 100%; height: 100%; border-radius: 50%;
      border: 2px solid var(--ig-bg); object-fit: cover; display: block;
    }
    .post-head .ph-name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 3px; }
    .post-head .ph-loc { font-size: 11px; color: var(--ig-text); }
    .post-head .more { margin-left: auto; background: none; border: none; color: var(--ig-text); cursor: pointer; font-size: 18px; padding: 4px 8px; }

    .post-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #efefef; display: block; }

    .post-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 12px 4px;
    }
    .post-actions .pa-btn { background: none; border: none; color: var(--ig-text); cursor: pointer; display: flex; padding: 0; }
    .post-actions .pa-btn.liked { color: var(--ig-red); }
    .post-actions .spacer { margin-left: auto; }

    .post-likes { padding: 2px 12px; font-weight: 600; font-size: 13px; }
    .post-caption { padding: 4px 12px; font-size: 13px; line-height: 18px; }
    .post-caption b { font-weight: 600; }
    .post-caption .more-link { color: var(--ig-secondary); cursor: pointer; }
    .post-time { padding: 4px 12px 2px; color: var(--ig-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: .2px; }

    .comments { padding: 6px 12px 16px; }
    .comments .view-all { color: var(--ig-secondary); font-size: 13px; margin-bottom: 10px; cursor: pointer; }
    .comment { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-start; }
    .comment .c-av { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #dbdbdb; }
    .comment .c-body { flex: 1; font-size: 13px; line-height: 17px; }
    .comment .c-body b { font-weight: 600; }
    .comment .c-meta { margin-top: 3px; font-size: 11px; color: var(--ig-secondary); display: flex; gap: 14px; }
    .comment .c-like { margin-left: auto; background: none; border: none; color: var(--ig-secondary); cursor: pointer; display: flex; padding-top: 4px; }
  </style>
</head>

    <!-- ===== Tabs ===== -->
    <nav class="tabs">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="3" y1="8" x2="21" y2="8"/>
          <path d="M8 3 11 8M14 3 17 8"/>
          <path d="M10 11.5v5l4.5-2.5z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button class="tab" data-tab="tagged" onclick="switchTab(this)" aria-label="Tagged">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M3 8a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" style="display:none"/>
          <path d="M21 7v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
          <circle cx="12" cy="10" r="2.4"/>
          <path d="M7.5 18a4.6 4.6 0 0 1 9 0"/>
        </svg>
      </button>
    </nav>

    <!-- ===== Grid ===== -->
    <main class="grid" id="grid"></main>
  </div>

  <!-- ===== Bottom nav ===== -->
  <nav class="bottom-nav">
    <button class="nav-btn" aria-label="Home">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-7h6v7h5a1 1 0 0 0 1-1V10z"/>
      </svg>
    </button>
    <button class="nav-btn" aria-label="Search">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/>
        <line x1="16.5" y1="16.5" x2="21" y2="21" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="nav-btn" aria-label="Reels">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/>
        <line x1="3" y1="8" x2="21" y2="8"/>
        <path d="M8 3 11 8M14 3 17 8"/>
        <path d="M10 11.5v5l4.5-2.5z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
    <button class="nav-btn" aria-label="Shop">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M4 8h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/>
        <path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/>
      </svg>
    </button>
    <button class="nav-btn" aria-label="Profile">
      <img class="nav-avatar" src="https://picsum.photos/seed/iamsezero/60" alt="Profile"
        onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23dbdbdb%22/%3E%3C/svg%3E'">
    </button>
  </nav>

  <!-- ===== Post detail modal ===== -->
  <div class="modal" id="postModal">
    <div class="modal-bar">
      <button class="back" onclick="closePost()" aria-label="Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="mb-title">iamsezero<b>게시물</b></div>
    </div>
    <div class="modal-scroll" id="modalScroll"></div>
  </div>

  <script>
    // ---- Build a 3-column post grid (Instagram style) ----
    var multiIcon = '<svg class="corner" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 2H6a2 2 0 0 0-2 2v10h2V4h10zm3 4H10a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg>';
    var reelIcon  = '<svg class="corner" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3 19 12 5 21z"/></svg>';

    function fmtViews(n){ return n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : n; }

    // Deterministic pseudo-random so content is stable per post
    function rnd(n) { var x = Math.sin(n * 99.13) * 10000; return x - Math.floor(x); }
    function commafy(n) { return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

    // ---- Generated content pools (Korean Instagram style) ----
    var CAPTIONS = [
      '오늘의 데일리룩 🤍\n#투아울라 #ootd #데일리룩',
      '코 끝이 시리지만 행복해😝',
      '주말 나들이 다녀왔어요 🍂 다들 어디 가셨어요?',
      '이 색감 너무 좋지 않나요? 📸✨',
      '협찬) 투아울라 신상 자켓 🧥\n프로필 링크에서 만나요 (코드 SEZERO 10%)',
      '가을 감성 가득 담아왔어요 🍁',
      '오랜만에 카페 투어 ☕️ 여기 분위기 미쳤다',
      '다들 좋은 하루 보내세요 🙋‍♀️',
      '새 옷 입고 신나서 한 컷 👗',
      '노을이 너무 예뻐서 한참 봤네요 📷'
    ];
    var TIMES = ['3시간', '5시간', '9시간', '1일', '2일', '4일', '6일', '1주', '2주', '3주'];
    var C_USERS = ['j.sy_jeong','min__99','hyunwoo.k','_seoyeon_','coco.daily','yuna_look','dani.kim_','soo._.young','haeun2','jiwon.ootd','mina_grm','tuaula_official','kkular_','daily.gram2','seoul_walker','rin.__.0'];
    var C_TEXTS = [
      '너무 예뻐요 😍','와 핏 미쳤다🔥','언니 오늘도 예뻐요🥹','이 색감 진짜 최고예요 📸','여기 어디예요?? 가보고싶다',
      '옷 정보 좀 알 수 있을까요?','분위기 깡패시네요😎','협찬 문의 디엠 드렸습니다!','투아울라 신상 너무 예뻐요🤍','매일 잘 보고 가요~',
      '세영님 미모 실화인가요💕','자켓 어디꺼예요?','오늘도 눈호강👍','사진 너무 잘 나왔다✨','진짜 인생샷이네요',
      '보정 어플 뭐 쓰세요?','첫 줄 사수 성공🙌','스토리 보고 달려왔어요🏃‍♀️','대박… 저장하고 갑니다📌','목도리 색깔 예뻐요🧣'
    ];

    var posts = [];
    for (var i = 1; i <= 18; i++) {
      var type = (i % 4 === 0) ? 'reel' : (i % 3 === 0 ? 'multi' : 'photo');
      var nComments = 3 + Math.floor(rnd(i * 7) * 4);       // 3-6 shown
      var comments = [];
      for (var c = 0; c < nComments; c++) {
        var r = rnd(i * 31 + c * 17);
        comments.push({
          user: C_USERS[Math.floor(rnd(i * 5 + c * 3) * C_USERS.length)],
          text: C_TEXTS[Math.floor(r * C_TEXTS.length)],
          time: TIMES[Math.floor(rnd(i + c * 2) * TIMES.length)],
          likes: Math.floor(rnd(i * 13 + c) * 40)
        });
      }
      posts.push({
        seed: 'p' + i,
        type: type,
        views: Math.floor(2000 + rnd(i * 3) * 90000),
        likes: 600 + Math.floor(rnd(i) * 4200),
        caption: CAPTIONS[(i - 1) % CAPTIONS.length],
        time: TIMES[(i - 1) % TIMES.length],
        totalComments: 14 + Math.floor(rnd(i * 9) * 180),
        comments: comments
      });
    }

    var IMG_FALLBACK = "this.onerror=null;this.parentNode.style.background='linear-gradient(135deg,#e8e8e8,#cfcfcf)';this.style.display='none';";

    var grid = document.getElementById('grid');
    grid.innerHTML = posts.map(function (p, idx) {
      var corner = p.type === 'reel' ? reelIcon : (p.type === 'multi' ? multiIcon : '');
      var views = p.type === 'reel'
        ? '<div class="views"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3 19 12 5 21z"/></svg>' + fmtViews(p.views) + '</div>'
        : '';
      return '<div class="cell" onclick="openPost(' + idx + ')">' +
        '<img loading="lazy" src="https://picsum.photos/seed/' + p.seed + '/300" alt="" onerror="' + IMG_FALLBACK + '">' +
        corner + views +
        '</div>';
    }).join('');

    // ---- Follow toggle ----
    function toggleFollow() {
      var b = document.getElementById('followBtn');
      if (b.classList.contains('following')) {
        b.classList.remove('following');
        b.textContent = 'Follow';
      } else {
        b.classList.add('following');
        b.textContent = 'Following';
      }
    }

    // ---- Tab switch (visual) ----
    function switchTab(el) {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
    }

    // ---- Post detail modal ----
    var heartOutline = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.2C.6 9 1.5 5.6 4.5 4.8 6.7 4.2 8.8 5.3 12 8c3.2-2.7 5.3-3.8 7.5-3.2 3 .8 3.9 4.2 2.5 7-2.5 4.6-10 9.2-10 9.2z"/></svg>';
    var heartFilled  = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.6 9 1.5 5.6 4.5 4.8 6.7 4.2 8.8 5.3 12 8c3.2-2.7 5.3-3.8 7.5-3.2 3 .8 3.9 4.2 2.5 7-2.5 4.6-10 9.2-10 9.2z"/></svg>';
    var iconComment = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20l1.1-4.1A8.38 8.38 0 0 1 3 11.5a8.5 8.5 0 0 1 9-8.4 8.48 8.48 0 0 1 9 8.4z"/></svg>';
    var iconShare = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
    var iconSave = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>';
    var smallHeart = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.2C.6 9 1.5 5.6 4.5 4.8 6.7 4.2 8.8 5.3 12 8c3.2-2.7 5.3-3.8 7.5-3.2 3 .8 3.9 4.2 2.5 7-2.5 4.6-10 9.2-10 9.2z"/></svg>';
    var verifiedMini = '<svg width="11" height="11" viewBox="0 0 40 40"><path fill="#3897f0" d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.358 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.358 0z"/><path fill="#fff" d="m18 25.367-4.969-4.969 1.414-1.414L18 22.539l8.555-8.555 1.414 1.414z"/></svg>';

    function commentHTML(c) {
      var likeStr = c.likes > 0 ? '<span>좋아요 ' + c.likes + '개</span>' : '';
      return '<div class="comment">' +
        '<img class="c-av" src="https://picsum.photos/seed/' + c.user + '/56" onerror="this.style.visibility=\'hidden\'">' +
        '<div class="c-body"><b>' + c.user + '</b> ' + c.text +
          '<div class="c-meta"><span>' + c.time + '</span>' + likeStr + '<span>답글 달기</span></div>' +
        '</div>' +
        '<button class="c-like" aria-label="Like">' + smallHeart + '</button>' +
      '</div>';
    }

    function openPost(idx) {
      var p = posts[idx];
      var capText = p.caption.replace(/\n/g, '<br>');
      var html =
        '<div class="post-head">' +
          '<img class="pa" src="https://picsum.photos/seed/iamsezero/64" onerror="this.style.background=\'#dbdbdb\'">' +
          '<div>' +
            '<div class="ph-name">iamsezero ' + verifiedMini + '</div>' +
            '<div class="ph-loc">Seoul, Korea</div>' +
          '</div>' +
          '<button class="more">⋯</button>' +
        '</div>' +
        '<img class="post-img" src="https://picsum.photos/seed/' + p.seed + '/600" onerror="' + IMG_FALLBACK.replace(/parentNode/g, 'parentElement') + '">' +
        '<div class="post-actions">' +
          '<button class="pa-btn" id="modalLike" onclick="toggleModalLike(' + idx + ')" aria-label="Like">' + heartOutline + '</button>' +
          '<button class="pa-btn" aria-label="Comment">' + iconComment + '</button>' +
          '<button class="pa-btn" aria-label="Share">' + iconShare + '</button>' +
          '<button class="pa-btn spacer" aria-label="Save">' + iconSave + '</button>' +
        '</div>' +
        '<div class="post-likes" id="modalLikes">좋아요 ' + commafy(p.likes) + '개</div>' +
        '<div class="post-caption"><b>iamsezero</b> ' + capText + '</div>' +
        '<div class="post-time">' + p.time + ' 전</div>' +
        '<div class="comments">' +
          '<div class="view-all">댓글 ' + commafy(p.totalComments) + '개 모두 보기</div>' +
          p.comments.map(commentHTML).join('') +
        '</div>';
      document.getElementById('modalScroll').innerHTML = html;
      document.getElementById('modalScroll').scrollTop = 0;
      var m = document.getElementById('postModal');
      m.classList.add('open');
      m.dataset.likes = p.likes;
      m.dataset.liked = '0';
      document.body.style.overflow = 'hidden';
    }

    function closePost() {
      document.getElementById('postModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function toggleModalLike(idx) {
      var m = document.getElementById('postModal');
      var btn = document.getElementById('modalLike');
      var label = document.getElementById('modalLikes');
      var base = posts[idx].likes;
      if (m.dataset.liked === '1') {
        m.dataset.liked = '0';
        btn.classList.remove('liked');
        btn.innerHTML = heartOutline;
        label.textContent = '좋아요 ' + commafy(base) + '개';
      } else {
        m.dataset.liked = '1';
        btn.classList.add('liked');
        btn.innerHTML = heartFilled;
        label.textContent = '좋아요 ' + commafy(base + 1) + '개';
      }
    }

    // Close modal with browser back / Esc
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePost(); });
  </script>
</body>
</html>
