  <style>
    :root {
      --ig-bg: #ffffff;
      --ig-text: #000000;
      --ig-secondary: #737373;
      --ig-border: #dbdbdb;
      --ig-blue: #0095f6;
      --ig-blue-hover: #1877f2;
      --ig-grey-btn: #efefef;
      --ig-grey-btn-hover: #dbdbdb;
      --ig-red: #ed4956;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --ig-bg: #000000;
        --ig-text: #ffffff;
        --ig-secondary: #a8a8a8;
        --ig-border: #262626;
        --ig-grey-btn: #363636;
        --ig-grey-btn-hover: #262626;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: var(--ig-bg);
      color: var(--ig-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      font-size: 14px;
      line-height: 18px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 470px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      border-left: 1px solid var(--ig-border);
      border-right: 1px solid var(--ig-border);
      padding-bottom: 56px;
      background: var(--ig-bg);
    }

    svg { display: block; }

    /* ===== Top bar ===== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 8px 0 16px;
      background: var(--ig-bg);
      border-bottom: 0.5px solid var(--ig-border);
    }
    .topbar .username {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 20px;
      font-weight: 700;
    }
    .topbar .username .lock { margin-right: 1px; }
    .topbar .username .verified { margin-left: 1px; }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ig-text);
      cursor: pointer;
      position: relative;
    }
    .icon-btn .badge {
      position: absolute;
      top: 6px;
      right: 6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      background: var(--ig-red);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      line-height: 16px;
      border-radius: 9px;
      text-align: center;
    }

    /* ===== Profile header ===== */
    .profile-header {
      padding: 16px 16px 0;
    }
    .ph-top {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }
    .avatar-ring {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .avatar-ring .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--ig-bg);
      background: #efefef;
      display: block;
    }
    .note-bubble {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ig-grey-btn);
      color: var(--ig-text);
      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 14px;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }
    .note-bubble::after,
    .note-bubble::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--ig-grey-btn);
    }
    .note-bubble::before { width: 8px; height: 8px; bottom: -8px; }
    .note-bubble::after { width: 4px; height: 4px; bottom: -14px; }

    .stats {
      flex: 1;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }
    .stat { cursor: pointer; }
    .stat .num {
      font-size: 17px;
      font-weight: 700;
      line-height: 20px;
    }
    .stat .label {
      font-size: 13px;
      color: var(--ig-text);
    }

    .ph-bio {
      padding-top: 12px;
      font-size: 14px;
      line-height: 19px;
    }
    .display-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .category { color: var(--ig-secondary); }
    .bio { white-space: pre-line; margin-top: 1px; }
    .bio .mention, .bio .tag { color: #00376b; }
    @media (prefers-color-scheme: dark) {
      .bio .mention, .bio .tag { color: #e0f1ff; }
    }
    .bio-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--ig-text);
      font-weight: 600;
      text-decoration: none;
      margin-top: 1px;
    }
    .bio-link svg { transform: rotate(0deg); }
    .followed-by {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--ig-secondary);
      font-size: 12px;
    }
    .followed-by .faces {
      display: flex;
    }
    .followed-by .faces img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--ig-bg);
      object-fit: cover;
      margin-left: -6px;
    }
    .followed-by .faces img:first-child { margin-left: 0; }

    /* ===== Action buttons ===== */
    .actions {
      display: flex;
      gap: 6px;
      padding: 14px 16px 0;
    }
    .btn {
      height: 32px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ig-text);
      background: var(--ig-grey-btn);
    }
    .btn:active { opacity: .7; }
    .btn.flex { flex: 1; }
    .btn.follow {
      background: var(--ig-blue);
      color: #fff;
    }
    .btn.follow.following { background: var(--ig-grey-btn); color: var(--ig-text); }
    .btn.icon { width: 32px; flex: none; }

    /* ===== Highlights ===== */
    .highlights {
      display: flex;
      gap: 16px;
      padding: 18px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .highlights::-webkit-scrollbar { display: none; }
    .highlight {
      flex-shrink: 0;
      width: 64px;
      text-align: center;
      cursor: pointer;
    }
    .highlight .h-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--ig-border);
      padding: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .highlight .h-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .highlight.new .h-ring {
      font-size: 26px;
      color: var(--ig-text);
      font-weight: 300;
    }
    .highlight .h-label {
      font-size: 12px;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ===== Tabs ===== */
    .tabs {
      position: sticky;
      top: 44px;
      z-index: 10;
      display: flex;
      border-top: 0.5px solid var(--ig-border);
      background: var(--ig-bg);
      margin-top: 4px;
    }
    .tab {
      flex: 1;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ig-secondary);
      border-bottom: 1px solid transparent;
      cursor: pointer;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }
    .tab.active {
      color: var(--ig-text);
      border-bottom: 1px solid var(--ig-text);
    }

    /* ===== Grid ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #efefef;
    }
    @media (prefers-color-scheme: dark) { .cell { background: #1a1a1a; } }
    .cell img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cell .corner {
      position: absolute;
      top: 7px;
      right: 7px;
      color: #fff;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.4));
    }
    .cell .views {
      position: absolute;
      bottom: 7px;
      left: 7px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
    }

    /* ===== Bottom nav ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 470px;
      height: 50px;
      padding-bottom: env(safe-area-inset-bottom);
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: var(--ig-bg);
      border-top: 0.5px solid var(--ig-border);
      z-index: 30;
    }
    .nav-btn {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      color: var(--ig-text);
      cursor: pointer;
    }
    .nav-btn .nav-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--ig-text);
    }
  </style>
</head>

        <path d="M4 8h16l-1.2 11a2 2 0 0 1-2 1.8H7.2a2 2 0 0 1-2-1.8z"/>
        <path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/>
      </svg>
    </button>
    <button class="nav-btn" aria-label="Profile">
      <img class="nav-avatar" src="https://picsum.photos/seed/ariacodes/60" alt="Profile"
        onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23dbdbdb%22/%3E%3C/svg%3E'">
    </button>
  </nav>

  <script>
    // ---- Build a 3-column post grid (Instagram style) ----
    var multiIcon = '<svg class="corner" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 2H6a2 2 0 0 0-2 2v10h2V4h10zm3 4H10a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2z"/></svg>';
    var reelIcon  = '<svg class="corner" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3 19 12 5 21z"/></svg>';

    function fmtViews(n){ return n >= 1000 ? (n/1000).toFixed(1).replace('.0','') + 'k' : n; }

    var posts = [];
    for (var i = 1; i <= 18; i++) {
      var type = (i % 4 === 0) ? 'reel' : (i % 3 === 0 ? 'multi' : 'photo');
      posts.push({ seed: 'p' + i, type: type, views: Math.floor(2000 + Math.random() * 90000) });
    }

    var grid = document.getElementById('grid');
    grid.innerHTML = posts.map(function (p) {
      var corner = p.type === 'reel' ? reelIcon : (p.type === 'multi' ? multiIcon : '');
      var views = p.type === 'reel'
        ? '<div class="views"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3 19 12 5 21z"/></svg>' + fmtViews(p.views) + '</div>'
        : '';
      var fallback = "this.onerror=null;this.parentNode.style.background='linear-gradient(135deg,#e8e8e8,#cfcfcf)';this.style.display='none';";
      return '<div class="cell">' +
        '<img loading="lazy" src="https://picsum.photos/seed/' + p.seed + '/300" alt="" onerror="' + fallback + '">' +
        corner + views +
        '</div>';
    }).join('');

    // ---- Follow toggle ----
    function toggleFollow() {
      var b = document.getElementById('followBtn');
      if (b.classList.contains('following')) {
        b.classList.remove('following');
        b.textContent = 'Follow';
      } else {
        b.classList.add('following');
        b.textContent = 'Following';
      }
    }

    // ---- Tab switch (visual) ----
    function switchTab(el) {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
    }
  </script>
</body>
</html>
