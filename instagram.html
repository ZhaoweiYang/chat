  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3CradialGradient id='g' r='150%25' cx='30%25' cy='107%25'%3E%3Cstop offset='0' stop-color='%23fdf497'/%3E%3Cstop offset='.45' stop-color='%23fd5949'/%3E%3Cstop offset='.6' stop-color='%23d6249f'/%3E%3Cstop offset='.9' stop-color='%23285AEB'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='4.5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Ccircle cx='17' cy='7' r='1.2' fill='%23fff'/%3E%3Crect x='4.5' y='4.5' width='15' height='15' rx='4.5' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
  <style>
    :root {
      --ig-bg: #ffffff;
      --ig-text: #000000;
      --ig-secondary: #737373;
      --ig-border: #dbdbdb;
      --ig-blue: #0095f6;
      --ig-grey-btn: #efefef;
      --ig-red: #ed4956;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ig-bg: #000000;
        --ig-text: #ffffff;
        --ig-secondary: #a8a8a8;
        --ig-border: #262626;
        --ig-grey-btn: #363636;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: var(--ig-bg);
      color: var(--ig-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif, "Apple Color Emoji";
      font-size: 14px;
      line-height: 18px;
      -webkit-font-smoothing: antialiased;
    }
    .app {
      max-width: 470px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      border-left: 1px solid var(--ig-border);
      border-right: 1px solid var(--ig-border);
      padding-bottom: 52px;
      background: var(--ig-bg);
    }
    svg { display: block; }

    /* ===== Top bar ===== */
    .topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center;
      height: 48px; padding: 0 10px;
      background: var(--ig-bg);
    }
    .topbar .back { background: none; border: none; color: var(--ig-text); cursor: pointer; padding: 6px; display: flex; }
    .topbar .username {
      display: flex; align-items: center; gap: 5px;
      font-size: 22px; font-weight: 700; margin-left: 4px;
    }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: var(--ig-text); cursor: pointer; position: relative;
    }

    /* ===== Profile header ===== */
    .profile-header { padding: 8px 16px 0; }
    .ph-top { display: flex; align-items: center; gap: 24px; }
    .avatar-ring {
      width: 92px; height: 92px; border-radius: 50%; padding: 3px; flex-shrink: 0;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .avatar-ring .avatar {
      width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--ig-bg); background: #efefef; display: block;
    }
    .stats { flex: 1; display: flex; justify-content: space-around; text-align: center; }
    .stat { cursor: pointer; }
    .stat .num { font-size: 18px; font-weight: 700; line-height: 22px; }
    .stat .label { font-size: 13px; color: var(--ig-text); }

    .followed-by {
      display: flex; align-items: center; gap: 9px;
      margin-top: 14px; color: var(--ig-text); font-size: 13px; line-height: 16px;
    }
    .followed-by .faces { display: flex; flex-shrink: 0; }
    .followed-by .faces img {
      width: 20px; height: 20px; border-radius: 50%;
      border: 1.5px solid var(--ig-bg); object-fit: cover; margin-left: -7px; background: #dbdbdb;
    }
    .followed-by .faces img:first-child { margin-left: 0; }
    .followed-by .fb-text { color: var(--ig-secondary); }
    .followed-by .fb-text b { color: var(--ig-text); font-weight: 600; }

    /* name + bio */
    .display-name { font-weight: 600; font-size: 14px; margin-top: 12px; }
    .bio { font-size: 13px; line-height: 18px; margin-top: 1px; white-space: pre-line; }
    .bio .tag { color: #00376b; }
    @media (prefers-color-scheme: dark) { .bio .tag { color: #e0f1ff; } }

    /* story highlights */
    .highlights { display: flex; gap: 16px; padding: 18px 16px 4px; overflow-x: auto; scrollbar-width: none; }
    .highlights::-webkit-scrollbar { display: none; }
    .highlight { flex-shrink: 0; width: 66px; text-align: center; cursor: pointer; }
    .highlight .h-ring { width: 66px; height: 66px; border-radius: 50%; border: 1px solid var(--ig-border); padding: 3px; overflow: hidden; background: var(--ig-bg); }
    .highlight .h-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
    .highlight .h-label { font-size: 12px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== Action buttons ===== */
    .actions { display: flex; gap: 6px; padding: 14px 16px 0; }
    .btn {
      height: 32px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
      color: var(--ig-text); background: var(--ig-grey-btn); font-family: inherit;
    }
    .btn:active { opacity: .7; }
    .btn.flex { flex: 1; }
    .btn.icon { width: 40px; flex: none; }
    .btn.following-blue { background: var(--ig-blue); color: #fff; }

    /* ===== Tabs ===== */
    .tabs {
      position: sticky; top: 48px; z-index: 10;
      display: flex; border-top: 0.5px solid var(--ig-border);
      background: var(--ig-bg); margin-top: 16px;
    }
    .tab {
      flex: 1; height: 44px; display: flex; align-items: center; justify-content: center;
      color: var(--ig-secondary); border-bottom: 1px solid transparent; cursor: pointer;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .tab.active { color: var(--ig-text); border-bottom: 1px solid var(--ig-text); }

    /* ===== Grid ===== */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5px; }
    .cell { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: #efefef; cursor: pointer; }
    @media (prefers-color-scheme: dark) { .cell { background: #1a1a1a; } }
    .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cell .corner { position: absolute; top: 7px; right: 7px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
    .cell .seen {
      position: absolute; left: 8px; color: #fff; font-size: 13px; font-weight: 600;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
    }
    .cell .seen.mid { top: 50%; transform: translateY(-50%); }
    .cell .seen.bottom { bottom: 8px; }

    /* ===== Bottom nav ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 470px; height: 50px; padding-bottom: env(safe-area-inset-bottom);
      display: flex; align-items: center; justify-content: space-around;
      background: var(--ig-bg); border-top: 0.5px solid var(--ig-border); z-index: 30;
    }
    .nav-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none; color: var(--ig-text); cursor: pointer; }
    .nav-btn .nav-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--ig-text); }

    /* ===== Post detail modal ===== */
    .modal {
      position: fixed; inset: 0; z-index: 50; background: var(--ig-bg);
      display: none; flex-direction: column; max-width: 470px; margin: 0 auto;
      animation: slideUp 0.22s ease;
    }
    .modal.open { display: flex; }
    @keyframes slideUp { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-bar {
      display: flex; align-items: center; height: 48px; flex-shrink: 0; padding: 0 6px;
      border-bottom: 0.5px solid var(--ig-border);
    }
    .modal-bar .back { background: none; border: none; color: var(--ig-text); cursor: pointer; display: flex; padding: 6px; }
    .modal-bar .mb-title { font-size: 16px; font-weight: 700; margin-left: 4px; }
    .modal-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; }

    .post-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
    .post-head .pa { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; padding: 1.6px;
      background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); }
    .post-head .pa-inner { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--ig-bg); object-fit: cover; display: block; background: #dbdbdb; }
    .post-head .ph-name { font-weight: 600; font-size: 13px; }
    .post-head .ph-loc { font-size: 11px; }
    .post-head .more { margin-left: auto; background: none; border: none; color: var(--ig-text); cursor: pointer; padding: 4px 8px; }

    /* media (single / carousel / reel) */
    .post-media { position: relative; width: 100%; background: #000; }
    .post-img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: #efefef; display: block; }
    .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .carousel::-webkit-scrollbar { display: none; }
    .carousel .slide { flex: 0 0 100%; scroll-snap-align: center; }
    .counter {
      position: absolute; top: 10px; right: 12px; background: rgba(0,0,0,.6); color: #fff;
      font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 11px;
    }
    .dots { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 4px; }
    .dots .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.55); transition: background .2s, transform .2s; }
    .dots .dot.on { background: #0095f6; }
    .reel-play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none;
    }
    .reel-play svg { filter: drop-shadow(0 1px 4px rgba(0,0,0,.5)); opacity: .92; }
    .reel-views {
      position: absolute; bottom: 10px; left: 12px; display: flex; align-items: center; gap: 5px;
      color: #fff; font-size: 13px; font-weight: 600; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6));
    }
    .reel-audio {
      display: flex; align-items: center; gap: 6px; padding: 9px 12px 2px;
      font-size: 12px; color: var(--ig-text);
    }

    .post-actions { display: flex; align-items: center; gap: 15px; padding: 9px 12px 4px; }
    .post-actions .pa-btn { background: none; border: none; color: var(--ig-text); cursor: pointer; display: flex; padding: 0; }
    .post-actions .pa-btn.liked { color: var(--ig-red); }
    .post-actions .spacer { margin-left: auto; }

    .post-likes { padding: 2px 12px; font-weight: 600; font-size: 13px; }
    .post-caption { padding: 4px 12px; font-size: 13px; line-height: 18px; white-space: pre-line; }
    .post-caption b { font-weight: 600; }
    .post-time { padding: 5px 12px 2px; color: var(--ig-secondary); font-size: 11px; }

    .comments { padding: 8px 12px 20px; }
    .comments .view-all { color: var(--ig-secondary); font-size: 13px; margin-bottom: 12px; cursor: pointer; }
    .comment { display: flex; gap: 10px; margin-bottom: 13px; align-items: flex-start; }
    .comment .c-av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #dbdbdb; }
    .comment .c-body { flex: 1; font-size: 13px; line-height: 17px; }
    .comment .c-body b { font-weight: 600; }
    .comment .c-meta { margin-top: 4px; font-size: 12px; color: var(--ig-secondary); display: flex; gap: 16px; }
    .comment .c-like { margin-left: auto; background: none; border: none; color: var(--ig-secondary); cursor: pointer; display: flex; padding-top: 5px; }

    /* double-tap like heart */
    .post-media { overflow: hidden; }
    .post-media video.post-img { object-fit: cover; }
    .dbl-heart {
      position: absolute; top: 50%; left: 50%; z-index: 6; pointer-events: none;
      transform: translate(-50%, -50%) scale(0); opacity: 0;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.45));
    }
    .dbl-heart.pop { animation: dblpop 1s ease forwards; }
    @keyframes dblpop {
      0%   { transform: translate(-50%,-50%) scale(0);    opacity: 0; }
      15%  { transform: translate(-50%,-50%) scale(1.2);  opacity: .95; }
      30%  { transform: translate(-50%,-50%) scale(.92); }
      45%  { transform: translate(-50%,-50%) scale(1);    opacity: .95; }
      80%  { opacity: .95; }
      100% { transform: translate(-50%,-50%) scale(1);    opacity: 0; }
    }
    /* carousel swipe hint */
    .swipe-hint {
      position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
      display: flex; align-items: center; gap: 3px; z-index: 4; pointer-events: none;
      background: rgba(0,0,0,.5); color: #fff; font-size: 12px; font-weight: 500;
      padding: 5px 11px; border-radius: 16px; animation: hintFade 3s ease forwards;
    }
    @keyframes hintFade {
      0%   { opacity: 0; transform: translateY(-50%) translateX(8px); }
      18%  { opacity: 1; transform: translateY(-50%) translateX(0); }
      72%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* floating sponsored CTA (shown on profile + post detail) */
    .ad-float {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(60px + env(safe-area-inset-bottom));
      width: calc(100% - 24px); max-width: 446px; z-index: 60;
      display: flex; align-items: center; gap: 11px;
      padding: 8px 14px 8px 8px; border-radius: 14px; cursor: pointer;
      background: linear-gradient(90deg, #feda75 0%, #fa7e1e 22%, #d62976 50%, #962fbf 78%, #4f5bd5 100%);
      box-shadow: 0 6px 22px rgba(214, 41, 118, .38);
      text-decoration: none; animation: adIn .35s ease;
    }
    @keyframes adIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .ad-float .ad-thumb {
      width: 42px; height: 42px; border-radius: 10px; object-fit: cover;
      flex-shrink: 0; background: rgba(255,255,255,.25);
    }
    .ad-float .ad-text { color: #fff; font-size: 15px; font-weight: 700; flex: 1; line-height: 1.15; letter-spacing: .2px; }
    .ad-float .ad-arrow { color: #fff; display: flex; flex-shrink: 0; opacity: .95; }

    /* ===== Feed (home) page ===== */
    .feed {
      position: fixed; inset: 0; z-index: 45; background: var(--ig-bg);
      max-width: 470px; margin: 0 auto; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform .28s ease; visibility: hidden;
      border-left: 1px solid var(--ig-border); border-right: 1px solid var(--ig-border);
    }
    .feed.open { transform: translateX(0); visibility: visible; }
    .feed-top {
      display: flex; align-items: center; height: 48px; flex-shrink: 0; padding: 0 14px;
      border-bottom: 0.5px solid var(--ig-border);
    }
    .ig-logo { font-family: 'Snell Roundhand', 'Segoe Script', 'Brush Script MT', cursive; font-size: 28px; font-weight: 600; }
    .feed-top-actions { margin-left: auto; display: flex; gap: 20px; }
    .feed-top-actions button { background: none; border: none; color: var(--ig-text); cursor: pointer; display: flex; padding: 0; position: relative; }
    .feed-top-actions .dot { position: absolute; top: -1px; right: -2px; width: 8px; height: 8px; background: var(--ig-red); border-radius: 50%; border: 1.5px solid var(--ig-bg); }
    .feed-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

    .stories { display: flex; gap: 15px; padding: 12px 14px; overflow-x: auto; scrollbar-width: none; border-bottom: 0.5px solid var(--ig-border); }
    .stories::-webkit-scrollbar { display: none; }
    .story { width: 64px; flex-shrink: 0; text-align: center; cursor: pointer; }
    .story .s-ring { width: 62px; height: 62px; border-radius: 50%; padding: 2.5px; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .story.mine .s-ring { background: var(--ig-border); }
    .story .s-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--ig-bg); background: #dbdbdb; display: block; }
    .story .s-name { font-size: 12px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fpost { margin-bottom: 6px; }
    .fpost-head { display: flex; align-items: center; gap: 9px; padding: 9px 12px; }
    .fpost-head .fa { width: 32px; height: 32px; border-radius: 50%; padding: 1.5px; background: linear-gradient(45deg, #f09433, #dc2743, #bc1888); flex-shrink: 0; }
    .fpost-head .fa img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--ig-bg); display: block; background: #dbdbdb; }
    .fpost-head .fn { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 3px; }
    .fpost-head .floc { font-size: 11px; }
    .fpost-head .fmore { margin-left: auto; background: none; border: none; color: var(--ig-text); cursor: pointer; padding: 4px; }
    .fpost-img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; background: #efefef; }
    .fpost-actions { display: flex; align-items: center; gap: 15px; padding: 9px 12px 4px; }
    .fpost-actions button { background: none; border: none; color: var(--ig-text); cursor: pointer; display: flex; padding: 0; }
    .fpost-actions button.liked { color: var(--ig-red); }
    .fpost-actions .sp { margin-left: auto; }
    .fpost-likes { padding: 2px 12px; font-weight: 600; font-size: 13px; }
    .fpost-cap { padding: 3px 12px; font-size: 13px; line-height: 18px; }
    .fpost-cap b { font-weight: 600; }
    .fpost-cmt { padding: 3px 12px; color: var(--ig-secondary); font-size: 13px; }
    .fpost-time { padding: 4px 12px 8px; color: var(--ig-secondary); font-size: 11px; }

    .feed .bottom-nav { position: static; transform: none; left: auto; width: auto; max-width: none; flex-shrink: 0; }
  </style>
</head>

          '<button class="more"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>' +
        '</div>' +
        mediaHTML(p) + audio +
        '<div class="post-actions">' +
          '<button class="pa-btn" id="modalLike" onclick="toggleModalLike(' + idx + ')" aria-label="赞">' + heartOutline + '</button>' +
          '<button class="pa-btn" aria-label="评论">' + iconComment + '</button>' +
          '<button class="pa-btn" aria-label="分享">' + iconShare + '</button>' +
          '<button class="pa-btn spacer" aria-label="收藏">' + iconSave + '</button>' +
        '</div>' +
        '<div class="post-likes" id="modalLikes">' + commafy(p.likes) + '次赞</div>' +
        '<div class="post-caption"><b>07_r1na</b> ' + p.caption + '</div>' +
        '<div class="post-time">' + p.time + '前</div>' +
        '<div class="comments">' +
          '<div class="view-all">查看全部 ' + commafy(p.totalComments) + ' 条评论</div>' +
          p.comments.map(commentHTML).join('') +
        '</div>';
      var sc = document.getElementById('modalScroll');
      sc.innerHTML = html;
      sc.scrollTop = 0;
      var m = document.getElementById('postModal');
      m.classList.add('open');
      m.style.transition = ''; m.style.transform = ''; m.style.opacity = '';
      m.dataset.liked = '0';
      m.dataset.likes = p.likes;
      document.body.style.overflow = 'hidden';
      setupMedia(idx);
    }

    function onCarousel() {
      var car = document.getElementById('carousel');
      if (!car) return;
      var idx = Math.round(car.scrollLeft / car.clientWidth);
      var total = car.children.length;
      document.getElementById('counter').textContent = (idx + 1) + '/' + total;
      var dots = document.getElementById('dots').children;
      for (var k = 0; k < dots.length; k++) dots[k].className = 'dot' + (k === idx ? ' on' : '');
      var hint = document.getElementById('swipeHint');
      if (hint) hint.style.display = 'none';
    }

    // ---- media interactions: double-tap like + video play/pause ----
    function setupMedia(idx) {
      var p = posts[idx];
      var media = document.querySelector('#modalScroll .post-media');
      if (!media) return;
      var lastTap = 0, timer = null;
      media.addEventListener('click', function () {
        var now = Date.now();
        if (now - lastTap < 300) {            // double tap → like
          clearTimeout(timer); lastTap = 0;
          doDoubleLike(media, idx);
        } else {                              // single tap → (reel) play/pause
          lastTap = now;
          timer = setTimeout(function () {
            if (p.type === 'reel') toggleReelVideo();
            lastTap = 0;
          }, 280);
        }
      });
      if (p.type === 'reel') {
        var v = document.getElementById('reelVideo');
        if (v) {
          v.addEventListener('play',  function () { var pl = document.getElementById('reelPlay'); if (pl) pl.style.display = 'none'; });
          v.addEventListener('pause', function () { var pl = document.getElementById('reelPlay'); if (pl) pl.style.display = 'flex'; });
          var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); // autoplay muted; fallback = poster + play btn
        }
      }
    }

    function doDoubleLike(media, idx) {
      var h = document.createElement('div');
      h.className = 'dbl-heart pop';
      h.innerHTML = bigHeartWhite;
      media.appendChild(h);
      setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 1000);
      var m = document.getElementById('postModal');
      if (m.dataset.liked !== '1') toggleModalLike(idx);  // like (+ turn heart red, +1)
    }

    function toggleReelVideo() {
      var v = document.getElementById('reelVideo');
      var pl = document.getElementById('reelPlay');
      if (!v) return;
      if (v.paused) {
        var pr = v.play();
        if (pr && pr.catch) pr.catch(function () { if (pl) pl.style.display = 'flex'; });
      } else {
        v.pause();
      }
    }

    function closePost() {
      document.getElementById('postModal').classList.remove('open');
      document.body.style.overflow = '';
    }

    function toggleModalLike(idx) {
      var m = document.getElementById('postModal');
      var btn = document.getElementById('modalLike');
      var label = document.getElementById('modalLikes');
      var base = posts[idx].likes;
      if (m.dataset.liked === '1') {
        m.dataset.liked = '0'; btn.classList.remove('liked'); btn.innerHTML = heartOutline;
        label.textContent = commafy(base) + '次赞';
      } else {
        m.dataset.liked = '1'; btn.classList.add('liked'); btn.innerHTML = heartFilled;
        label.textContent = commafy(base + 1) + '次赞';
      }
    }

    // ---- follow toggle ----
    function toggleFollow() {
      var b = document.getElementById('followBtn');
      if (b.classList.contains('following-blue')) {
        b.classList.remove('following-blue');
        b.innerHTML = '已关注 <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15.5 5.5 9l1.4-1.4 5.1 5.1 5.1-5.1L18.5 9 12 15.5z"/></svg>';
      } else {
        b.classList.add('following-blue');
        b.textContent = '关注';
      }
    }

    // ---- tab switch (visual) ----
    function switchTab(el) {
      document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
      el.classList.add('active');
    }

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePost(); });

    // ---- swipe-to-dismiss post detail (drag horizontally to exit, like Instagram) ----
    (function () {
      var modal = document.getElementById('postModal');
      var startX = 0, startY = 0, dx = 0, dy = 0, w = 0;
      var decided = false, dragging = false, ignore = false;

      function onStart(x, y, target) {
        // let the carousel handle its own horizontal scroll
        ignore = !!(target && target.closest && target.closest('#carousel'));
        startX = x; startY = y; dx = 0; dy = 0; decided = false; dragging = false;
        w = modal.clientWidth || window.innerWidth;
        modal.style.transition = 'none';
      }
      function onMove(x, y, e) {
        if (ignore) return;
        dx = x - startX; dy = y - startY;
        if (!decided) {
          if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
          decided = true;
          dragging = Math.abs(dx) > Math.abs(dy);   // horizontal intent → drag to dismiss
        }
        if (dragging) {
          if (e && e.cancelable) e.preventDefault();  // block vertical scroll while dragging
          var damp = 1 - Math.min(Math.abs(dx) / w, 1) * 0.12;
          modal.style.transform = 'translateX(' + dx + 'px) scale(' + damp.toFixed(3) + ')';
        }
      }
      function onEnd() {
        if (ignore) { ignore = false; return; }
        if (dragging) {
          if (Math.abs(dx) > w * 0.28) {            // far enough → fling out & close
            var dir = dx < 0 ? -1 : 1;
            modal.style.transition = 'transform .2s ease';
            modal.style.transform = 'translateX(' + (dir * w) + 'px) scale(.9)';
            setTimeout(function () {
              closePost();
              modal.style.transition = ''; modal.style.transform = '';
            }, 195);
          } else {                                  // not enough → spring back
            modal.style.transition = 'transform .24s cubic-bezier(.2,.8,.3,1)';
            modal.style.transform = 'translateX(0)';
            setTimeout(function () { modal.style.transition = ''; }, 250);
          }
        }
        dragging = false; decided = false;
      }

      modal.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { ignore = true; return; }
        onStart(e.touches[0].clientX, e.touches[0].clientY, e.target);
      }, { passive: true });
      modal.addEventListener('touchmove', function (e) {
        if (e.touches.length !== 1) return;
        onMove(e.touches[0].clientX, e.touches[0].clientY, e);
      }, { passive: false });
      modal.addEventListener('touchend', onEnd);

      // mouse drag (desktop)
      var mouseDown = false;
      modal.addEventListener('mousedown', function (e) { mouseDown = true; onStart(e.clientX, e.clientY, e.target); });
      window.addEventListener('mousemove', function (e) { if (mouseDown) onMove(e.clientX, e.clientY, e); });
      window.addEventListener('mouseup', function () { if (mouseDown) { mouseDown = false; onEnd(); } });
    })();

    // ===== Instagram feed (home) page =====
    var vbadge = '<svg width="12" height="12" viewBox="0 0 40 40"><path fill="#3897f0" d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.358 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.358 0z"/><path fill="#fff" d="m18 25.367-4.969-4.969 1.414-1.414L18 22.539l8.555-8.555 1.414 1.414z"/></svg>';
    var fmoreIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';

    var FEED = [
      { user: '07_r1na', v: true, av: AVATAR_URL, img: REAL_IMAGES[0], loc: 'Seoul, Korea', cap: '韓国生活、毎日が幸せ🤍 #07', likes: 23148, time: '2時間前', cmt: 563 },
      { user: 'yuna_look', v: false, av: 'https://picsum.photos/seed/yuna_look/80', img: 'https://picsum.photos/seed/fp2/640/800', loc: '', cap: '오늘의 룩 ☁️ 다들 좋은 하루', likes: 1820, time: '4時間前', cmt: 88 },
      { user: '07_r1na', v: true, av: AVATAR_URL, img: REAL_IMAGES[1], loc: '', cap: 'みんな見てくれてありがとう💕 また投稿するね', likes: 31980, time: '6時間前', cmt: 402 },
      { user: 'tomo.gram', v: false, av: 'https://picsum.photos/seed/tomo.gram/80', img: 'https://picsum.photos/seed/fp4/640/800', loc: 'Tokyo, Japan', cap: '週末さんぽ🌿', likes: 940, time: '8時間前', cmt: 23 },
      { user: 'minji_v', v: false, av: 'https://picsum.photos/seed/minji_v/80', img: 'https://picsum.photos/seed/fp5/640/800', loc: '', cap: '좋은 하루 보내세요☺️', likes: 2610, time: '10時間前', cmt: 51 }
    ];

    function fpostHTML(p) {
      var loc = p.loc ? '<div class="floc">' + p.loc + '</div>' : '';
      return '<div class="fpost">' +
        '<div class="fpost-head">' +
          '<div class="fa"><img src="' + p.av + '" onerror="' + IMG_FB + '"></div>' +
          '<div><div class="fn">' + p.user + (p.v ? ' ' + vbadge : '') + '</div>' + loc + '</div>' +
          '<button class="fmore">' + fmoreIcon + '</button>' +
        '</div>' +
        '<img class="fpost-img" src="' + p.img + '" onerror="' + IMG_FB + '">' +
        '<div class="fpost-actions">' +
          '<button onclick="toggleFeedLike(this,' + p.likes + ')" aria-label="赞">' + heartOutline + '</button>' +
          '<button aria-label="评论">' + iconComment + '</button>' +
          '<button aria-label="分享">' + iconShare + '</button>' +
          '<button class="sp" aria-label="收藏">' + iconSave + '</button>' +
        '</div>' +
        '<div class="fpost-likes">' + commafy(p.likes) + '次赞</div>' +
        '<div class="fpost-cap"><b>' + p.user + '</b> ' + p.cap + '</div>' +
        '<div class="fpost-cmt">查看全部 ' + commafy(p.cmt) + ' 条评论</div>' +
        '<div class="fpost-time">' + p.time + '</div>' +
      '</div>';
    }

    function toggleFeedLike(btn, base) {
      var label = btn.closest('.fpost').querySelector('.fpost-likes');
      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked'); btn.innerHTML = heartOutline; label.textContent = commafy(base) + '次赞';
      } else {
        btn.classList.add('liked'); btn.innerHTML = heartFilled; label.textContent = commafy(base + 1) + '次赞';
      }
    }

    (function buildFeed() {
      var storyUsers = [['yuna_look', 'st1'], ['minji_v', 'st2'], ['haru.31', 'st3'], ['kenta__', 'st4'], ['sara.0305', 'st5'], ['tomo.gram', 'st6']];
      var s = '<div class="story mine"><div class="s-ring"><img src="' + AVATAR_URL + '" onerror="' + IMG_FB + '"></div><div class="s-name">我的快拍</div></div>';
      s += storyUsers.map(function (u) {
        return '<div class="story"><div class="s-ring"><img src="https://picsum.photos/seed/' + u[1] + '/120" onerror="' + IMG_FB + '"></div><div class="s-name">' + u[0] + '</div></div>';
      }).join('');
      document.getElementById('stories').innerHTML = s;
      document.getElementById('feedPosts').innerHTML = FEED.map(fpostHTML).join('');
    })();

    function openFeed() {
      document.getElementById('feedScroll').scrollTop = 0;
      document.getElementById('feedPage').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeFeed() {
      document.getElementById('feedPage').classList.remove('open');
      document.body.style.overflow = '';
    }

    // swipe-left on profile → open feed ; swipe-right on feed → back to profile
    function attachSwipe(el, dirToTrigger, action) {
      var sx = 0, sy = 0, decided = false, horiz = false, ig = false;
      el.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) { ig = true; return; }
        ig = !!(e.target.closest && e.target.closest('.highlights, .stories, #carousel'));
        sx = e.touches[0].clientX; sy = e.touches[0].clientY; decided = false; horiz = false;
      }, { passive: true });
      el.addEventListener('touchmove', function (e) {
        if (ig || e.touches.length !== 1 || decided) return;
        var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        decided = true; horiz = Math.abs(dx) > Math.abs(dy);
      }, { passive: true });
      el.addEventListener('touchend', function (e) {
        if (ig) { ig = false; return; }
        if (!decided || !horiz) return;
        var t = e.changedTouches && e.changedTouches[0]; if (!t) return;
        var dx = t.clientX - sx;
        if (dirToTrigger === 'left' && dx < -60) action();
        if (dirToTrigger === 'right' && dx > 60) action();
      });
    }
    attachSwipe(document.querySelector('.app'), 'left', openFeed);
    attachSwipe(document.getElementById('feedPage'), 'right', closeFeed);
  </script>
