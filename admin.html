<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <div class="lang-bar">
    <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIcon">&#9788;</span></button>
    <a href="index.html" class="nav-link">Home</a>
    <a href="developer.html" class="nav-link">Developer</a>
  </div>

  <!-- Login -->
  <section id="loginScreen" class="page active">
    <div class="page-inner auth-container">
      <h1 class="portal-title">Admin Portal</h1>
      <p class="portal-sub">DAO MESSAGE</p>
      <div class="form-group" style="margin-top:32px;">
        <label>Admin Password</label>
        <input type="password" id="adminPass" class="input" placeholder="Enter password">
      </div>
      <button class="btn-primary" onclick="doAdminLogin()">Login</button>
      <p class="auth-error" id="adminError"></p>
    </div>
  </section>

  <!-- Dashboard -->
  <section id="adminDash" class="page">
    <div class="page-inner">
      <div class="dash-header">
        <h2 class="portal-title-sm">Admin Dashboard</h2>
        <button class="btn-ghost btn-sm" onclick="doAdminLogout()">Logout</button>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-num" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statApproved">0</span>
          <span class="stat-label">Approved</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statRejected">0</span>
          <span class="stat-label">Rejected</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="statDevs">0</span>
          <span class="stat-label">Developers</span>
        </div>
      </div>

      <!-- Pending Reviews -->
      <div class="card">
        <h3 class="card-title">Pending Reviews</h3>
        <div id="pendingList" class="template-review-list"></div>
      </div>

      <!-- All Templates -->
      <div class="card">
        <h3 class="card-title">All Templates</h3>
        <div class="filter-row">
          <button class="filter-btn active" onclick="filterAll(this, 'all')">All</button>
          <button class="filter-btn" onclick="filterAll(this, 'approved')">Approved</button>
          <button class="filter-btn" onclick="filterAll(this, 'rejected')">Rejected</button>
          <button class="filter-btn" onclick="filterAll(this, 'pending')">Pending</button>
        </div>
        <div id="allList" class="template-review-list"></div>
      </div>
    </div>
  </section>

  <script src="store.js"></script>
  <script>
    // ---- Theme ----
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("dao_theme", next);
      document.getElementById("themeIcon").innerHTML = next === "dark" ? "&#9788;" : "&#9790;";
    }
    (function initTheme() {
      const t = localStorage.getItem("dao_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeIcon").innerHTML = t === "dark" ? "&#9788;" : "&#9790;";
    })();

    // ---- Admin Auth ----
    let isAdmin = false;
    let currentFilter = "all";

    function doAdminLogin() {
      const pass = document.getElementById("adminPass").value;
      if (verifyAdmin(pass)) {
        isAdmin = true;
        localStorage.setItem("dao_admin_session", "1");
        showAdminDash();
      } else {
        document.getElementById("adminError").textContent = "Wrong password.";
      }
    }

    function doAdminLogout() {
      isAdmin = false;
      localStorage.removeItem("dao_admin_session");
      document.getElementById("loginScreen").classList.add("active");
      document.getElementById("adminDash").classList.remove("active");
    }

    function showAdminDash() {
      document.getElementById("loginScreen").classList.remove("active");
      document.getElementById("adminDash").classList.add("active");
      refreshData();
    }

    // ---- Data ----
    function refreshData() {
      const tpls = getTemplates();
      const devs = getDevelopers();

      document.getElementById("statPending").textContent = tpls.filter(t => t.status === "pending").length;
      document.getElementById("statApproved").textContent = tpls.filter(t => t.status === "approved").length;
      document.getElementById("statRejected").textContent = tpls.filter(t => t.status === "rejected").length;
      document.getElementById("statDevs").textContent = devs.length;

      renderPending();
      renderAll(currentFilter);
    }

    function renderPending() {
      const list = document.getElementById("pendingList");
      const pending = getPendingTemplates();

      if (pending.length === 0) {
        list.innerHTML = '<p class="empty-msg">No pending templates.</p>';
        return;
      }

      list.innerHTML = pending.map(t => `
        <div class="review-card">
          <div class="review-info">
            <h4>${esc(t.name)}</h4>
            <p>${esc(t.description)}</p>
            ${t.preview ? `<a href="${esc(t.preview)}" target="_blank" class="preview-link">Preview &#8599;</a>` : ""}
            <div class="review-meta">
              <span>${t.platforms.join(", ")}</span>
              <span>${t.price > 0 ? "$" + t.price : "Free"}</span>
              <span>Dev: ${t.devId}</span>
              <span>${new Date(t.createdAt).toLocaleDateString()}</span>
            </div>
          </div>
          <div class="review-actions">
            <button class="btn-approve" onclick="doApprove('${t.id}')">Approve</button>
            <button class="btn-reject" onclick="doReject('${t.id}')">Reject</button>
          </div>
        </div>`).join("");
    }

    function renderAll(filter) {
      const list = document.getElementById("allList");
      let tpls = getTemplates();
      if (filter !== "all") tpls = tpls.filter(t => t.status === filter);

      if (tpls.length === 0) {
        list.innerHTML = '<p class="empty-msg">No templates found.</p>';
        return;
      }

      list.innerHTML = tpls.map(t => {
        const statusClass = t.status === "approved" ? "status-approved" : t.status === "rejected" ? "status-rejected" : "status-pending";
        return `
          <div class="review-card">
            <div class="review-info">
              <h4>${esc(t.name)}</h4>
              <p>${esc(t.description)}</p>
              <div class="review-meta">
                <span class="badge ${statusClass}">${t.status}</span>
                <span>${t.platforms.join(", ")}</span>
                <span>${t.price > 0 ? "$" + t.price : "Free"}</span>
                <span>Dev: ${t.devId}</span>
              </div>
            </div>
          </div>`;
      }).join("");
    }

    function filterAll(btn, filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderAll(filter);
    }

    function doApprove(id) {
      reviewTemplate(id, true);
      refreshData();
    }

    function doReject(id) {
      reviewTemplate(id, false);
      refreshData();
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    // ---- Enter key ----
    document.getElementById("adminPass").addEventListener("keydown", e => {
      if (e.key === "Enter") doAdminLogin();
    });

    // ---- Init ----
    if (localStorage.getItem("dao_admin_session") === "1") {
      isAdmin = true;
      showAdminDash();
    }
  </script>
</body>
</html>
