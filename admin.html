<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Admin Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <!-- Login Screen -->
  <section id="loginScreen" class="auth-page active">
    <div class="auth-container">
      <div class="lang-bar">
        <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIconAuth">&#9788;</span></button>
        <a href="index.html" class="nav-link" data-pt="nav_home"></a>
        <select id="portalLangSelect" onchange="switchPortalLang(this.value)">
          <option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option>
          <option value="ru">Русский</option><option value="pt">Português</option><option value="es">Español</option>
        </select>
      </div>
      <h1 class="portal-title" data-pt="admin_title"></h1>
      <p class="portal-sub">DAO MESSAGE</p>
      <div class="form-group" style="margin-top:32px;">
        <label data-pt="admin_pass_label"></label>
        <input type="password" id="adminPass" class="input" data-pt-ph="admin_pass_ph">
      </div>
      <button class="btn-primary" onclick="doAdminLogin()" data-pt="btn_login"></button>
      <p class="auth-error" id="adminError"></p>
    </div>
  </section>

  <!-- Sidebar Layout -->
  <button class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</button>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div id="portalLayout" class="portal-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">DAO MESSAGE</div>
        <div class="sidebar-title" data-pt="admin_title"></div>
      </div>

      <nav class="sidebar-nav">
        <button class="sidebar-item active" onclick="showPanel('dashboard')" data-panel="dashboard">
          <span class="sb-icon">&#9635;</span>
          <span data-pt="nav_dashboard">Dashboard</span>
        </button>
        <button class="sidebar-item" onclick="showPanel('pending')" data-panel="pending">
          <span class="sb-icon">&#9201;</span>
          <span data-pt="nav_pending">Pending Reviews</span>
        </button>
        <button class="sidebar-item" onclick="showPanel('all')" data-panel="all">
          <span class="sb-icon">&#9776;</span>
          <span data-pt="nav_all_tpl">All Templates</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-utils">
          <button class="theme-btn" onclick="toggleTheme()" title="Toggle theme"><span id="themeIcon">&#9788;</span></button>
          <a href="index.html" class="nav-link" data-pt="nav_home"></a>
          <select id="portalLangSelectSidebar" onchange="switchPortalLang(this.value)">
            <option value="zh">中文</option><option value="en">English</option><option value="fr">Français</option>
            <option value="ru">Русский</option><option value="pt">Português</option><option value="es">Español</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="topbar">
        <h2 class="topbar-title" data-pt="admin_dash"></h2>
        <button class="btn-ghost btn-sm" onclick="doAdminLogout()" data-pt="btn_logout"></button>
      </div>

      <!-- Dashboard Panel -->
      <div id="panelDashboard" class="panel-view active">
        <div class="stats-row">
          <div class="stat-card"><span class="stat-num" id="statPending">0</span><span class="stat-label" data-pt="stat_pending"></span></div>
          <div class="stat-card"><span class="stat-num" id="statApproved">0</span><span class="stat-label" data-pt="stat_approved"></span></div>
          <div class="stat-card"><span class="stat-num" id="statPublished">0</span><span class="stat-label" data-pt="stat_published"></span></div>
          <div class="stat-card"><span class="stat-num" id="statRejected">0</span><span class="stat-label" data-pt="stat_rejected"></span></div>
          <div class="stat-card"><span class="stat-num" id="statDevs">0</span><span class="stat-label" data-pt="stat_devs"></span></div>
        </div>
      </div>

      <!-- Pending Reviews Panel -->
      <div id="panelPending" class="panel-view">
        <div class="content-header">
          <h2 data-pt="pending_title"></h2>
        </div>
        <div id="pendingList" class="template-review-list"></div>
      </div>

      <!-- All Templates Panel -->
      <div id="panelAll" class="panel-view">
        <div class="content-header">
          <h2 data-pt="all_tpl_title"></h2>
        </div>
        <div class="filter-row" id="filterRow"></div>
        <div id="allList" class="template-review-list"></div>
      </div>
    </main>
  </div>

  <script src="store.js?v=8"></script>
  <script src="portal-i18n.js?v=8"></script>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("dao_theme", next);
      const icon = next === "dark" ? "&#9788;" : "&#9790;";
      document.getElementById("themeIcon").innerHTML = icon;
      document.getElementById("themeIconAuth").innerHTML = icon;
    }
    (function initTheme() {
      const t = localStorage.getItem("dao_theme") || "dark";
      document.documentElement.setAttribute("data-theme", t);
      const icon = t === "dark" ? "&#9788;" : "&#9790;";
      document.getElementById("themeIcon").innerHTML = icon;
      document.getElementById("themeIconAuth").innerHTML = icon;
    })();

    // Sidebar navigation
    function showPanel(name) {
      document.querySelectorAll(".panel-view").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".sidebar-item[data-panel]").forEach(b => b.classList.remove("active"));
      const panelId = "panel" + name.charAt(0).toUpperCase() + name.slice(1);
      const panel = document.getElementById(panelId);
      if (panel) panel.classList.add("active");
      const btn = document.querySelector(`.sidebar-item[data-panel="${name}"]`);
      if (btn) btn.classList.add("active");
      // Close mobile sidebar
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("sidebarOverlay").classList.remove("active");
      // Refresh data for panels
      if (name === "dashboard") refreshStats();
      if (name === "pending") renderPending();
      if (name === "all") { renderFilters(); renderAll(currentFilter); }
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
      document.getElementById("sidebarOverlay").classList.toggle("active");
    }

    let currentFilter = "all";

    async function doAdminLogin() {
      try {
        await adminLogin(document.getElementById("adminPass").value);
        await showAdminDash();
      } catch(e) {
        document.getElementById("adminError").textContent = pt("wrong_pass");
      }
    }

    function doAdminLogout() {
      adminLogout();
      document.getElementById("loginScreen").classList.add("active");
      document.getElementById("portalLayout").classList.remove("active");
    }

    async function showAdminDash() {
      document.getElementById("loginScreen").classList.remove("active");
      document.getElementById("portalLayout").classList.add("active");
      await refreshData();
    }

    function renderFilters() {
      document.getElementById("filterRow").innerHTML = [
        { key: "all", label: pt("filter_all") },
        { key: "pending", label: pt("filter_pending") },
        { key: "approved", label: pt("filter_approved") },
        { key: "published", label: pt("filter_published") },
        { key: "rejected", label: pt("filter_rejected") }
      ].map(f => `<button class="filter-btn ${f.key === currentFilter ? 'active' : ''}" onclick="filterAll(this, '${f.key}')">${f.label}</button>`).join("");
    }

    async function refreshStats() {
      try {
        const stats = await getAdminStats();
        document.getElementById("statPending").textContent = stats.pending;
        document.getElementById("statApproved").textContent = stats.approved;
        document.getElementById("statPublished").textContent = stats.published;
        document.getElementById("statRejected").textContent = stats.rejected;
        document.getElementById("statDevs").textContent = stats.developers;
      } catch(e) { console.error(e); }
    }

    async function refreshData() {
      await refreshStats();
      renderFilters();
      await renderPending();
      await renderAll(currentFilter);
    }

    async function renderPending() {
      const list = document.getElementById("pendingList");
      try {
        const pending = await getAdminTemplates("pending");
        if (pending.length === 0) { list.innerHTML = `<p class="empty-msg">${pt("no_pending")}</p>`; return; }
        list.innerHTML = pending.map(t => `
          <div class="review-card review-card-vertical">
            <div class="review-info">
              <h4>${esc(t.name)}</h4>
              <p>${esc(t.description)}</p>
              ${t.images && t.images.length ? `<div class="review-imgs">${t.images.map(s => `<img src="${s}" class="review-thumb">`).join("")}</div>` : ""}
              <div class="review-meta"><span>${t.platforms.join(", ")}</span><span>${t.price > 0 ? "$" + t.price : pt("free")}</span><span>Dev: ${t.devId}</span><span>${new Date(t.createdAt).toLocaleDateString()}</span></div>
            </div>
            <div class="review-actions-row">
              <button class="btn-approve" onclick="doApprove('${t.id}')">${pt("btn_approve")}</button>
              <button class="btn-reject" onclick="doReject('${t.id}')">${pt("btn_reject")}</button>
            </div>
          </div>`).join("");
      } catch(e) { list.innerHTML = `<p class="empty-msg">${e.message}</p>`; }
    }

    async function renderAll(filter) {
      const list = document.getElementById("allList");
      try {
        const tpls = await getAdminTemplates(filter === "all" ? "" : filter);
        if (tpls.length === 0) { list.innerHTML = `<p class="empty-msg">${pt("no_tpl_found")}</p>`; return; }
        list.innerHTML = tpls.map(t => {
          const sc = t.status === "published" ? "status-published" : t.status === "approved" ? "status-approved" : t.status === "rejected" ? "status-rejected" : "status-pending";
          const canReject = t.status === "approved" || t.status === "published";
          const canApprove = t.status === "rejected";
          let btns = "";
          if (canApprove) btns += `<button class="btn-approve" onclick="doApprove('${t.id}')">${pt("btn_approve")}</button>`;
          if (canReject) btns += `<button class="btn-reject" onclick="doReject('${t.id}')">${pt("btn_reject")}</button>`;
          const actionsHtml = btns ? `<div class="review-actions-row" style="margin-top:8px;">${btns}</div>` : "";
          return `<div class="review-card review-card-vertical"><div class="review-info"><h4>${esc(t.name)}</h4><p>${esc(t.description)}</p><div class="review-meta"><span class="badge ${sc}">${pt("status_" + t.status)}</span><span>${t.platforms.join(", ")}</span><span>${t.price > 0 ? "$" + t.price : pt("free")}</span><span>Dev: ${t.devId}</span></div></div>${actionsHtml}</div>`;
        }).join("");
      } catch(e) { list.innerHTML = `<p class="empty-msg">${e.message}</p>`; }
    }

    async function filterAll(btn, filter) {
      currentFilter = filter;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      await renderAll(filter);
    }

    async function doApprove(id) { await reviewTemplate(id, true); await refreshData(); }
    async function doReject(id) { await reviewTemplate(id, false); await refreshData(); }
    function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    document.getElementById("adminPass").addEventListener("keydown", e => { if (e.key === "Enter") doAdminLogin(); });

    // Sync lang selects
    function syncLangSelects() {
      const val = document.getElementById("portalLangSelect").value;
      const sidebar = document.getElementById("portalLangSelectSidebar");
      if (sidebar) sidebar.value = val;
    }

    // Init
    initPortalLang();
    syncLangSelects();
    if (isAdminLoggedIn()) showAdminDash();
  </script>
</body>
</html>
