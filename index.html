<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Decentralized Communication</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Language Selector -->
  <div class="lang-bar">
    <button id="themeToggle" onclick="toggleTheme()" class="theme-btn" title="Toggle theme">
      <span id="themeIcon">&#9788;</span>
    </button>
    <select id="langSelect" onchange="switchLang(this.value)">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="pt">Português</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- Page 1: Landing -->
  <section id="page1" class="page active">
    <div class="page-inner">
      <h1 class="logo">DAO MESSAGE</h1>
      <p class="subtitle" data-i18n="subtitle"></p>

      <div class="features">
        <div class="feature">
          <h3 data-i18n="feature1_title"></h3>
          <p data-i18n="feature1_desc"></p>
        </div>
        <div class="feature">
          <h3 data-i18n="feature2_title"></h3>
          <p data-i18n="feature2_desc"></p>
        </div>
        <div class="feature">
          <h3 data-i18n="feature3_title"></h3>
          <p data-i18n="feature3_desc"></p>
        </div>
      </div>

      <button class="btn-primary" onclick="goTo('page2')" data-i18n="join_btn"></button>
    </div>
  </section>

  <!-- Page 2: How to get client + Template market -->
  <section id="page2" class="page">
    <div class="page-inner">
      <button class="btn-back" onclick="goTo('page1')">&larr;</button>
      <h2 data-i18n="how_title"></h2>

      <div class="method">
        <h3 data-i18n="method1_title"></h3>
        <a href="https://doc.daomessage.com" target="_blank" rel="noopener">doc.daomessage.com &#8599;</a>
      </div>

      <div class="method">
        <h3 data-i18n="method2_title"></h3>
        <a href="https://viberstreet.com/browse/all/dao-message" target="_blank" rel="noopener" data-i18n="method2_link"></a>
      </div>

      <p class="tip" data-i18n="tip_ai"></p>
    </div>
  </section>

  <script src="i18n.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
