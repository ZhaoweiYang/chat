<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAO MESSAGE - Decentralized Communication</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Language Selector -->
  <div class="lang-bar">
    <select id="langSelect" onchange="switchLang(this.value)">
      <option value="zh">中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="ru">Русский</option>
      <option value="pt">Português</option>
      <option value="es">Español</option>
    </select>
  </div>

  <!-- Page 1: Landing -->
  <section id="page1" class="page active">
    <div class="page-inner">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="22" stroke="url(#g1)" stroke-width="2"/>
            <path d="M14 20l10-8 10 8-10 8z" stroke="url(#g1)" stroke-width="1.5" fill="rgba(124,111,247,0.15)"/>
            <path d="M14 28l10-8 10 8-10 8z" stroke="url(#g1)" stroke-width="1.5" fill="rgba(34,211,238,0.1)"/>
            <circle cx="24" cy="24" r="3" fill="url(#g1)"/>
            <defs><linearGradient id="g1" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#7c6ff7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          </svg>
        </div>
        <h1 class="logo">DAO MESSAGE</h1>
      </div>
      <p class="subtitle" data-i18n="subtitle"></p>

      <div class="features">
        <div class="feature">
          <h3 data-i18n="feature1_title"></h3>
          <p data-i18n="feature1_desc"></p>
        </div>
        <div class="feature">
          <h3 data-i18n="feature2_title"></h3>
          <p data-i18n="feature2_desc"></p>
        </div>
        <div class="feature">
          <h3 data-i18n="feature3_title"></h3>
          <p data-i18n="feature3_desc"></p>
        </div>
      </div>

      <button class="btn-primary" onclick="goTo('page2')" data-i18n="join_btn"></button>
    </div>
  </section>

  <!-- Page 2: How to get client + Template market -->
  <section id="page2" class="page">
    <div class="page-inner">
      <button class="btn-back" onclick="goTo('page1')">&larr;</button>
      <h2 data-i18n="how_title"></h2>

      <div class="method">
        <h3 data-i18n="method1_title"></h3>
        <a href="https://doc.daomessage.com" target="_blank" rel="noopener">doc.daomessage.com &#8599;</a>
      </div>

      <div class="method" style="margin-bottom: 16px;">
        <h3 data-i18n="method2_title"></h3>
      </div>

      <p class="tip" data-i18n="tip_ai"></p>

      <div class="platform-tabs">
        <span class="tab active">Android</span>
        <span class="tab">iOS</span>
        <span class="tab">PWA</span>
        <span class="tab">macOS</span>
        <span class="tab">Windows</span>
        <span class="tab">Linux</span>
      </div>

      <div class="template-list">
        <div class="template-card">
          <div class="template-info">
            <h3 data-i18n="tpl_a_title"></h3>
            <p data-i18n="tpl_a_desc"></p>
          </div>
          <button class="btn-outline" onclick="onDownload('Template-A', 0)" data-i18n="tpl_use"></button>
        </div>

        <div class="template-card">
          <div class="template-info">
            <h3 data-i18n="tpl_b_title"></h3>
            <p data-i18n="tpl_b_desc"></p>
          </div>
          <button class="btn-outline" onclick="onDownload('Template-B', 1)">$1</button>
        </div>

        <div class="template-card">
          <div class="template-info">
            <h3 data-i18n="tpl_c_title"></h3>
            <p data-i18n="tpl_c_desc"></p>
          </div>
          <button class="btn-outline" onclick="onDownload('Template-C', 0)" data-i18n="tpl_use"></button>
        </div>

        <div class="template-card">
          <div class="template-info">
            <h3 data-i18n="tpl_d_title"></h3>
            <p data-i18n="tpl_d_desc"></p>
          </div>
          <button class="btn-outline" onclick="onDownload('Template-D', 2)">$2</button>
        </div>

        <div class="template-card">
          <div class="template-info">
            <h3 data-i18n="tpl_e_title"></h3>
            <p data-i18n="tpl_e_desc"></p>
          </div>
          <button class="btn-outline" onclick="onDownload('Template-E', 1)">$1</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Captcha Modal -->
  <div id="captchaModal" class="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeCaptcha()">&times;</button>
      <p class="modal-title" data-i18n="captcha_title"></p>
      <div class="captcha-body">
        <canvas id="captchaCanvas" width="200" height="70"></canvas>
        <button class="captcha-refresh" onclick="generateCaptcha()" title="Refresh">&#8635;</button>
      </div>
      <div class="captcha-input-row">
        <input type="text" id="captchaInput" maxlength="4" autocomplete="off" data-i18n-placeholder="captcha_placeholder">
        <button class="btn-captcha-submit" onclick="verifyCaptcha()" data-i18n="captcha_submit"></button>
      </div>
      <p class="captcha-hint" id="captchaHint"></p>
    </div>
  </div>

  <script src="i18n.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
